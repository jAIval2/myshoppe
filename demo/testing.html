<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Studio — Live Garment Preview</title>
<!--
  Test page for one pre-made plate (torso view, straight kurta).
  WebGL2, one full-screen triangle, one fragment shader, no libraries.
  It draws only when a choice changes (no animation loop).

  Needs an HTTP server (WebGL cannot read images from file://):
    cd myshoppe/demo && python3 -m http.server 8000   →  http://localhost:8000/testing.html
-->
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fbf8f3;
    --ink: #1d1a16;
    --muted: #6f675d;
    --line: rgba(29, 26, 22, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .studio-shell {
    display: grid;
    grid-template-columns: minmax(320px, 430px) minmax(280px, 360px);
    gap: 40px;
    align-items: start;
    max-width: 860px;
    width: 100%;
  }
  @media (max-width: 760px) {
    body { padding: 16px; }
    .studio-shell { grid-template-columns: 1fr; gap: 24px; }
  }
  /* JOURNEY BAR (halfway.md step 7) */
  .journey { width: 100%; max-width: 860px; margin: -12px 0 22px; }
  .journey ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .journey li { flex: 1 0 auto; }
  .journey button {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: background 0.16s, color 0.16s, border-color 0.16s;
  }
  .journey .num {
    width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 11px; background: rgba(29, 26, 22, 0.07); color: var(--ink);
  }
  .journey button[aria-current="step"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .journey button[aria-current="step"] .num { background: var(--card); color: var(--ink); }
  .journey button.done:not([aria-current="step"]) { color: var(--ink); }
  .journey button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 760px) {                         /* phone: the five steps share one row */
    .journey { margin: -4px 0 14px; }
    .journey li { flex: 1 1 0; min-width: 0; }
    .journey button { padding: 8px 4px; gap: 5px; font-size: 11.5px; }
  }
  @media (max-width: 440px) { .journey .num { display: none; } }
  /* STUDIO STAGE */
  .stage-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #e5ddd0;
    box-shadow: 0 20px 48px rgba(29, 26, 22, 0.12);
  }
  .stage-frame img,
  .stage-frame canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage-frame canvas { visibility: hidden; }        /* the photo shows until the first frame */
  .stage-frame canvas#fade { visibility: visible; opacity: 0; pointer-events: none; }   /* the old view, faded out on a step change */
  .stage-frame canvas#fade.fading { transition: opacity 250ms ease-out; }
  @media (prefers-reduced-motion: reduce) { .stage-frame canvas#fade.fading { transition: none; } }
  .stage-col { display: grid; gap: 14px; align-content: start; }
  .before-btn {
    position: absolute; top: 14px; right: 14px; padding: 7px 12px; border-radius: 999px; border: 0;
    background: rgba(251, 248, 243, 0.9); backdrop-filter: blur(8px); color: var(--ink); font: inherit; font-size: 11px;
    letter-spacing: 0.04em; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .before-btn[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .before-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .review-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .review-strip[hidden] { display: none; }
  .review-strip figure { margin: 0; }
  .review-strip canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 10px; background: #e5ddd0; }
  .review-strip figcaption { font-size: 10.5px; color: var(--muted); margin-top: 5px; text-align: center; }
  .stage-frame canvas.ready { visibility: visible; }
  .stage-caption {
    position: absolute;
    bottom: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(251, 248, 243, 0.86);
    backdrop-filter: blur(8px);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .stage-note {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(251, 248, 243, 0.92);
    font-size: 12px;
    line-height: 1.45;
    display: none;
  }
  .stage-note.show { display: block; }
  .stage-badge {
    position: absolute; top: 14px; left: 14px; max-width: calc(100% - 136px); margin: 0;   /* clear of the before button */
    padding: 6px 11px; border-radius: 999px; background: rgba(251, 248, 243, 0.9); backdrop-filter: blur(8px);
    font-size: 11px; line-height: 1.35; color: var(--ink); display: none;
  }
  .stage-badge.show { display: block; }
  /* NECKLINE PIVOTS (halfway.md step 4): an SVG layer in plate px over the canvas */
  .pivots { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; overflow: visible; touch-action: none; }   /* only the outer svg's touch-action counts */
  .pivots.show { display: block; }
  .pivots .rail { fill: none; stroke: rgba(251, 248, 243, 0.9); stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .pivots .rail-shadow { fill: none; stroke: rgba(29, 26, 22, 0.35); stroke-width: 4.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .pivots .stop { fill: rgba(251, 248, 243, 0.95); stroke: rgba(29, 26, 22, 0.5); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .pivots .handle { pointer-events: all; cursor: grab; touch-action: none; outline: none; }
  .pivots .handle.drag { cursor: grabbing; }
  .pivots .hit { fill: transparent; }
  .pivots .dot { fill: #fbf8f3; stroke: #1d1a16; stroke-width: 2; vector-effect: non-scaling-stroke; transition: fill 0.15s; }
  .pivots .ring { fill: none; stroke: transparent; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .pivots .handle:hover .dot, .pivots .handle.drag .dot { fill: #fff; }
  .pivots .handle:focus-visible .ring { stroke: #1d1a16; }
  .neck-values { font-size: 13px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 11px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
  /* EDITORIAL CONTROLS */
  .panel {
    display: grid;
    gap: 26px;
    padding-top: 8px;
  }
  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .swatch-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.18s;
  }
  .swatch-card[aria-pressed="true"] {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .swatch-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0, 0, 0, 0.12);
    background-size: cover;
    background-position: center;
  }
  .swatch-meta strong {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
  }
  .swatch-meta span {
    font-size: 11px;
    color: var(--muted);
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.16s, color 0.16s, border-color 0.16s;
  }
  .pill[aria-pressed="true"] {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }
  .pill:focus-visible,
  .swatch-card:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .lace-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .lace-card {
    display: grid; gap: 7px; padding: 8px 10px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    color: var(--ink); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; transition: border-color 0.18s;
  }
  .lace-card strong { font-weight: 500; }
  .lace-card[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .lace-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .lace-strip { height: 26px; border-radius: 6px; background-color: #8f7a66; background-size: auto 100%; background-repeat: repeat-x; }
  .pill.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .step-nav { display: flex; justify-content: space-between; gap: 8px; }
  .review-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 13px; }
  .review-list dt { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 2px; }
  .review-list dd { margin: 0; }
  .panel [hidden] { display: none !important; }
  .stat {
    font-size: 11px;
    color: var(--muted);
    margin: 10px 0 0;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<!-- JOURNEY (halfway.md step 7): one step = one fixed view -->
<nav class="journey" aria-label="Design steps">
  <ol>
    <li><button data-step="cloth"><span class="num">1</span>Cloth</button></li>
    <li><button data-step="neck"><span class="num">2</span>Neckline</button></li>
    <li><button data-step="sleeve"><span class="num">3</span>Sleeves</button></li>
    <li><button data-step="hem"><span class="num">4</span>Hem</button></li>
    <li><button data-step="review"><span class="num">5</span>Review</button></li>
  </ol>
</nav>

<div class="studio-shell">
  <!-- LEFT: STAGE — photo underneath (fallback), WebGL canvas on top -->
  <div class="stage-col">
  <div class="stage-frame">
    <img src="assets/plates/torso-straight/base.jpg" alt="" width="1200" height="1600">
    <canvas id="stage" role="img" aria-label="Straight kurta on a dress form"></canvas>
    <canvas id="fade" aria-hidden="true"></canvas>
    <svg class="pivots" id="pivots" viewBox="0 0 1200 1600" preserveAspectRatio="none">
      <g id="rails"></g>
      <g class="handle" id="h-cf" data-pivot="cf" role="slider" tabindex="0" aria-label="Neckline depth at the centre front" aria-orientation="vertical">
        <circle class="hit"/><circle class="ring"/><circle class="dot"/></g>
      <g class="handle" id="h-l" data-pivot="l" role="slider" tabindex="0" aria-label="Neckline width, left point" aria-orientation="horizontal">
        <circle class="hit"/><circle class="ring"/><circle class="dot"/></g>
      <g class="handle" id="h-r" data-pivot="r" role="slider" tabindex="0" aria-label="Neckline width, right point" aria-orientation="horizontal">
        <circle class="hit"/><circle class="ring"/><circle class="dot"/></g>
    </svg>
    <p class="stage-badge" id="badge" aria-live="polite"></p>
    <button class="before-btn" id="before" aria-pressed="false" title="Hold (or hold the space key) to see the plain garment">Hold: before</button>
    <p class="stage-note" id="note"></p>
    <div class="stage-caption">
      <span id="caption-fabric">Sage Embroidered Organza</span>
      <span id="caption-trim">Pearl Guipure Lace</span>
    </div>
  </div>
  <div class="review-strip" id="review-strip" hidden>
    <figure><canvas data-thumb="neck" width="300" height="400"></canvas><figcaption>Neckline</figcaption></figure>
    <figure><canvas data-thumb="sleeve" width="300" height="400"></canvas><figcaption>Shoulder &amp; sleeve</figcaption></figure>
    <figure><canvas data-thumb="hem" width="300" height="400"></canvas><figcaption>Hem &amp; slit</figcaption></figure>
  </div>
  </div>

  <!-- RIGHT: CONTROLS (the sections of the current step) -->
  <div class="panel">
    <div data-section="fabric">
      <p class="eyebrow">Cloth</p>
      <div class="swatch-grid" data-group="fabric">
        <button class="swatch-card" aria-pressed="false" data-fabric="off">
          <span class="swatch-dot" style="background:#f4f1ec"></span>
          <span class="swatch-meta"><strong>Original</strong><span>Plain white toile</span></span>
        </button>
        <button class="swatch-card" aria-pressed="true" data-fabric="sage">
          <span class="swatch-dot" style="background-color:#9fb096; background-image:url('assets/swatches/fabric-sage-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Sage Organza</strong><span>Floral embroidery</span></span>
        </button>
        <button class="swatch-card" aria-pressed="false" data-fabric="mocha">
          <span class="swatch-dot" style="background-color:#8a5a35; background-image:url('assets/swatches/fabric-mocha-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Mocha Chikan</strong><span>Tonal vine embroidery</span></span>
        </button>
        <button class="swatch-card" aria-pressed="false" data-fabric="mustard">
          <span class="swatch-dot" style="background-color:#e0a01e; background-image:url('assets/swatches/fabric-mustard-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Mustard Gauze</strong><span>Crinkled cotton</span></span>
        </button>
      </div>
    </div>

    <div data-section="lace">
      <p class="eyebrow">Lace</p>
      <div class="lace-grid" data-group="lace">
        <button class="lace-card" aria-pressed="true" data-lace="pearl"><span class="lace-strip" style="background-image:url('assets/swatches/lace-pearl-2048.webp')"></span><strong>Pearl guipure</strong></button>
        <button class="lace-card" aria-pressed="false" data-lace="geometric"><span class="lace-strip" style="background-image:url('assets/swatches/lace-geometric-2048.webp')"></span><strong>Woven diamond</strong></button>
        <button class="lace-card" aria-pressed="false" data-lace="leaf"><span class="lace-strip" style="background-image:url('assets/swatches/lace-leaf-2048.webp')"></span><strong>Resham bel</strong></button>
        <button class="lace-card" aria-pressed="false" data-lace="fine"><span class="lace-strip" style="background-image:url('assets/swatches/lace-fine-2048.webp')"></span><strong>Kiran zari</strong></button>
        <button class="lace-card" aria-pressed="false" data-lace="paisley"><span class="lace-strip" style="background-image:url('assets/swatches/lace-paisley-2048.webp')"></span><strong>Zari paisley</strong></button>
        <button class="lace-card" aria-pressed="false" data-lace="brocade"><span class="lace-strip" style="background-image:url('assets/swatches/lace-brocade-2048.webp')"></span><strong>Navy gold brocade</strong></button>
      </div>
      <p class="eyebrow" style="margin:16px 0 8px">Placement</p>
      <div class="pill-row">
        <button class="pill" aria-pressed="true" data-trim="neck">Neckline</button>
        <button class="pill" aria-pressed="true" data-trim="cuffs">Sleeve cuffs</button>
        <button class="pill" aria-pressed="true" data-trim="hem">Hem border</button>
        <button class="pill" aria-pressed="false" data-trim="slits">Chaak slits</button>
      </div>
    </div>

    <div id="neck-panel" data-section="neckline">
      <p class="eyebrow">Neckline shape</p>
      <p class="neck-values" aria-live="polite"><span id="neck-depth">Depth — mm</span> · <span id="neck-width">Width — mm</span></p>
      <div class="pill-row">
        <button class="pill" id="neck-reset">Reset</button>
        <button class="pill" id="neck-snap" aria-pressed="true">Snap to stops</button>
      </div>
      <p class="hint" id="neck-hint"></p>
    </div>

    <div data-section="review" id="review-panel">
      <p class="eyebrow">Your kurta</p>
      <dl class="review-list" id="review-list"></dl>
      <div class="pill-row">
        <button class="pill primary" id="share">Share image</button>
        <button class="pill" id="download">Download image</button>
      </div>
      <p class="hint" id="share-hint"></p>
    </div>

    <div class="step-nav">
      <button class="pill" id="prev-step">Back</button>
      <button class="pill primary" id="next-step">Next</button>
    </div>

    <div data-section="test" id="test-panel">
      <p class="eyebrow">Test</p>
      <div class="pill-row">
        <button class="pill" aria-pressed="false" data-test="checker">Grain checker</button>
        <button class="pill" aria-pressed="false" data-test="photo">Show photo only</button>
      </div>
      <p class="stat" id="stat"></p>
    </div>
  </div>
</div>

<script src="plate.js"></script>
<script src="maps.js"></script>
<script>
(() => {
  // one journey step = one fixed view = one plate (render.md §4)
  const VIEWS = {
    torso:  { plate: "assets/plates/torso-straight/",  name: "full torso" },
    neck:   { plate: "assets/plates/neck-straight/",   name: "neckline" },
    sleeve: { plate: "assets/plates/sleeve-straight/", name: "shoulder and sleeve" },
    hem:    { plate: "assets/plates/hem-straight/",    name: "hem and slit" },
  };
  // repeatCm = real width of one tile (assumptions until the atelier measures them)
  const FABRICS = {
    sage:    { src: "assets/swatches/fabric-sage-1024.jpg",    repeatCm: 30, name: "Sage Embroidered Organza", sheen: 0, sheenWidth: 1, antiTile: false },
    mocha:   { src: "assets/swatches/fabric-mocha-1024.jpg",   repeatCm: 30, name: "Mocha Chikan", sheen: 0, sheenWidth: 1, antiTile: true },
    mustard: { src: "assets/swatches/fabric-mustard-1024.jpg", repeatCm: 20, name: "Mustard Crinkled Gauze", sheen: 0, sheenWidth: 1, antiTile: true },
  };
  // laces: horizontal band, decorative edge at the bottom (tools/prep_lace.py)
  const LACES = {
    pearl:     { src: "assets/swatches/lace-pearl-2048.webp", meta: "assets/swatches/lace-pearl.json", mat: "assets/swatches/lace-pearl-mat.webp",     name: "Pearl Guipure Lace" },
    geometric: { src: "assets/swatches/lace-geometric-2048.webp", meta: "assets/swatches/lace-geometric.json", mat: "assets/swatches/lace-geometric-mat.webp", name: "Woven Diamond Border" },
    leaf:      { src: "assets/swatches/lace-leaf-2048.webp", meta: "assets/swatches/lace-leaf.json", mat: "assets/swatches/lace-leaf-mat.webp",      name: "Resham Bel Lace" },
    fine:      { src: "assets/swatches/lace-fine-2048.webp", meta: "assets/swatches/lace-fine.json", mat: "assets/swatches/lace-fine-mat.webp",      name: "Kiran Zari Edge" },
    paisley:   { src: "assets/swatches/lace-paisley-2048.webp", meta: "assets/swatches/lace-paisley.json", mat: "assets/swatches/lace-paisley-mat.webp", name: "Zari Paisley Lotus Lace" },
    brocade:   { src: "assets/swatches/lace-brocade-2048.webp", meta: "assets/swatches/lace-brocade.json", name: "Navy & Gold Brocade Border" },
  };
  // trim id in id.png (G channel) → button group; flip = pearls on the other side of the strip
  const TRIMS = { neck: 1, "cuff-l": 2, "cuff-r": 3, hem: 4, "slit-l": 5, "slit-r": 6, "hem-bl": 7, "hem-br": 8 };   // hem-bl / hem-br: the hem of the side pieces of the hem view
  const FLIP = { "slit-r": 1 };
  const VIEW_FLIP = {};                                // per-view override of FLIP (set after checking the pearls)
  const GROUP = { neck: ["neck"], cuffs: ["cuff-l", "cuff-r"], hem: ["hem", "hem-bl", "hem-br"], slits: ["slit-l", "slit-r"] };

  const params0 = new URLSearchParams(location.search);    // test switches: ?view=neck|sleeve|hem  ?fabric=mocha  ?lace=leaf
  const state = { view: VIEWS[params0.get("view")] ? params0.get("view") : "torso",
                  fabric: FABRICS[params0.get("fabric")] || params0.get("fabric") === "off" ? params0.get("fabric") : "sage",
                  lace: LACES[params0.get("lace")] ? params0.get("lace") : "pearl", trims: params0.has("trims") ? Object.fromEntries(["neck", "cuffs", "hem", "slits"].map((k) => [k, params0.get("trims").split(",").includes(k)])) : { neck: true, cuffs: true, hem: true, slits: false }, checker: params0.get("checker") === "1", photo: false };   // test: ?checker=1  the grain checker (2 cm squares from the uv: no fabric texture, so no texel noise)
  const stageImg = document.querySelector(".stage-frame img");

  const canvas = document.getElementById("stage");
  const note = document.getElementById("note");
  const stat = document.getElementById("stat");
  const fail = (msg) => { note.textContent = msg; note.classList.add("show"); };

  const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true }); // we draw rarely: keep the last frame
  if (!gl) { fail("WebGL2 is not available. The photo is shown without changes."); return; }
  if (location.protocol === "file:") {
    fail("Open this page through a local server: run  python3 -m http.server  in the myshoppe/demo folder, then open http://localhost:8000/testing.html");
    return;
  }

  // ---------- shaders
  const VS = `#version 300 es
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);   // one big triangle
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FS = `#version 300 es
  precision highp float;
  precision highp int;
  uniform sampler2D uPhoto, uId, uUV, uUVT, uShade, uFabric, uLace, uLaceMat;
  uniform vec2  uCanvas;        // canvas size in device px
  uniform vec2  uPlate;         // plate size (1200, 1600)
  uniform float uCmPerPx;       // plate px → cm
  uniform float uRange;         // UV range in cm (128)
  uniform float uFabricOn, uFabricCm;
  uniform float uLaceAspect;
  uniform float uTrimOn[9], uTrimWcm[9], uTrimFlip[9];
  uniform float uTrimFit[9], uTrimU0[9];
  uniform float uTrimVMax[9], uTrimEdging[9];   // stored V range of each strip (1.5 = edging strip); 1 = lace hangs past the edge
  uniform float uDisplaceMm;    // fabric shifted along the shade gradient in folds, mm at a strong fold slope (0 = off), step 7
  uniform float uSheen, uSheenWidth, uSheenOld;   // directional sheen of the fabric; uSheenOld = the old fixed 0.15 highlight (?sheen=0)
  uniform float uAntiTile;      // 1 = hex tiling of the fabric (irregular fabrics only), step 7
  uniform float uRelief;        // lace relief, metal and pearl (polish.md step 6); 0 = off (?relief=0)
  uniform float uHasMat;        // 1 = the lace has a material map on unit 7
  uniform float uLaceEdge;      // edgeDepth of the lace: share of its height that hangs past the garment edge
  uniform float uChecker, uPhotoOnly;
  uniform float uMipBias;       // log2 bias on the texture footprint (negative = sharper)
  uniform float uAniso;         // 1 = use plate UV gradients, 0 = round footprint
  uniform float uShadeOn;       // test: 0 = flat light (no folds), to measure the fold contrast of the render
  uniform float uShadowStrength; // darkening of the fabric under the lace (0 = off), polish.md step 1
  uniform vec2  uShadowMm;       // shadow offset on the stage in mm: right, down (key light at the upper left)
  uniform float uLinear;        // 1 = light maths in linear light (polish.md step 2), 0 = the old sRGB maths (?linear=0)
  uniform float uSrgbTex;       // 1 = colour textures are SRGB8_ALPHA8 (the GPU decodes), 0 = decode here (fallback)
  uniform float uShadeSqrt;     // the plate's shadeEncoding == "sqrt": shade = 2 * stored^2, linear light
  uniform float uShadeMed;      // the plate's shadeMedian / 255 (to convert between the two shade spaces)
  // ---- live neckline (halfway.md steps 2, 3, 5). In the neck area (id.png B = 1) the garment edge, the reveal fills and the
  // neck trim come from curves, not from the baked maps. All curves in plate px, 24 points, corner to corner (left to right).
  uniform float uNeckLive;      // 1 = live neckline, 0 = the baked maps (?neck=baked)
  uniform vec2  uNE[24];        // live edge
  uniform vec2  uNE0[24];       // photographed edge (same 24 picks: segment i of uNE matches segment i of uNE0)
  uniform vec2  uNC[24];        // live trim centre line
  uniform float uNeckTw;        // trim width, plate px
  uniform vec3  uFormRGB, uToileRGB;   // plain fills (?revealfill=0): form and toile colour, sRGB 0..1
  uniform float uRevealFill;    // step 3: 1 = fills from the photo, 0 = plain colours
  uniform vec4  uFormPatch;     // a clean square of the dress form in the photo (x0, y0, x1, y1 plate px): its fine detail
  uniform vec2  uCfX;           // x of the centre front (plate px), and 1 / mm per plate px
  uniform float uGlow;          // step 7: the selected part glows softly (0..1, animated over about 1 s)
  uniform float uGlowTrim[9];   // which trims glow (a placement was selected)
  uniform float uGlowNeck;      // 1 = the band along the live neck edge glows (a pivot was selected)
  out vec4 outColor;
  const float HL_LIN = 0.05;

  // sRGB <-> linear (exact sRGB curve)
  vec3 toLin(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
  vec3 toSRGB(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  float toLin1(float c) { return toLin(vec3(c)).r; }
  float toSRGB1(float c) { return toSRGB(vec3(c)).r; }
  // a colour texture sample in the working space of the shader
  vec4 cin(vec4 t) { return (uLinear > 0.5 && uSrgbTex < 0.5) ? vec4(toLin(t.rgb), t.a) : t; }
  // stored shade -> shade in the working space (linear ratio, or the old sRGB ratio)
  float shadeOf(float stored) {
    if (uShadeSqrt > 0.5) {
      float sl = 2.0 * stored * stored;                                   // linear ratio
      return uLinear > 0.5 ? sl : toSRGB1(min(sl * toLin1(uShadeMed), 1.0)) / uShadeMed;
    }
    float so = stored * 2.0;                                               // old file: sRGB ratio
    return uLinear > 0.5 ? toLin1(min(so * uShadeMed, 1.0)) / toLin1(uShadeMed) : so;
  }

  vec2 decode(vec4 t) {                       // 12-bit packed → cm
    vec3 c = floor(t.rgb * 255.0 + 0.5);
    float u = c.r * 16.0 + floor(c.b / 16.0);
    float v = c.g * 16.0 + mod(c.b, 16.0);
    return vec2(u, v) / 4095.0 * uRange;
  }

  // UV step per canvas px, from the plate itself (central difference over +-R plate px).
  // Used only when both neighbours are in the same zone / trim: no derivatives across zone edges.
  const int R = 4;
  void gradFabric(ivec2 p, int zone, float k, out vec2 gx, out vec2 gy) {
    ivec2 mx = ivec2(uPlate) - 1;
    ivec2 a = clamp(p + ivec2(R, 0), ivec2(0), mx), b = clamp(p - ivec2(R, 0), ivec2(0), mx);
    ivec2 c = clamp(p + ivec2(0, R), ivec2(0), mx), d = clamp(p - ivec2(0, R), ivec2(0), mx);
    float iso = uCmPerPx * k / uFabricCm;                              // round footprint (cm per canvas px)
    gx = vec2(iso, 0.0); gy = vec2(0.0, iso);
    if (uAniso < 0.5) return;
    bool okx = int(texelFetch(uId, a, 0).r * 255.0 + 0.5) == zone && int(texelFetch(uId, b, 0).r * 255.0 + 0.5) == zone
            && texelFetch(uId, a, 0).g == 0.0 && texelFetch(uId, b, 0).g == 0.0;
    bool oky = int(texelFetch(uId, c, 0).r * 255.0 + 0.5) == zone && int(texelFetch(uId, d, 0).r * 255.0 + 0.5) == zone
            && texelFetch(uId, c, 0).g == 0.0 && texelFetch(uId, d, 0).g == 0.0;
    if (okx && oky) {
      gx = (decode(texelFetch(uUV, a, 0)) - decode(texelFetch(uUV, b, 0))) / float(a.x - b.x) * k / uFabricCm;
      gy = (decode(texelFetch(uUV, c, 0)) - decode(texelFetch(uUV, d, 0))) / float(c.y - d.y) * k / uFabricCm;
    }
  }
  void gradTrim(ivec2 p, int trim, float k, float w, float fit, out vec2 gx, out vec2 gy) {
    ivec2 mx = ivec2(uPlate) - 1;
    ivec2 a = clamp(p + ivec2(R, 0), ivec2(0), mx), b = clamp(p - ivec2(R, 0), ivec2(0), mx);
    ivec2 c = clamp(p + ivec2(0, R), ivec2(0), mx), d = clamp(p - ivec2(0, R), ivec2(0), mx);
    float iso = uCmPerPx * k / w;                                       // lace height is 1 in texture T
    gx = vec2(iso / (uLaceAspect * fit), 0.0); gy = vec2(0.0, iso);
    if (uAniso < 0.5) return;
    bool ok = int(texelFetch(uId, a, 0).g * 255.0 + 0.5) == trim && int(texelFetch(uId, b, 0).g * 255.0 + 0.5) == trim
           && int(texelFetch(uId, c, 0).g * 255.0 + 0.5) == trim && int(texelFetch(uId, d, 0).g * 255.0 + 0.5) == trim;
    if (!ok) return;
    vec2 sx = (decode(texelFetch(uUVT, a, 0)) - decode(texelFetch(uUVT, b, 0))) / float(a.x - b.x) * k;
    vec2 sy = (decode(texelFetch(uUVT, c, 0)) - decode(texelFetch(uUVT, d, 0))) / float(c.y - d.y) * k;
    gx = vec2(sx.x / (w * uLaceAspect * fit), sx.y / uRange);           // across (V) is 0..1 over the strip
    gy = vec2(sy.x / (w * uLaceAspect * fit), sy.y / uRange);
  }

  // ---- step 7: hex tiling (offsets only, no rotation: the grain direction stays), contrast-preserving blend
  vec2 hash2(vec2 q) { return fract(sin(vec2(dot(q, vec2(127.1, 311.7)), dot(q, vec2(269.5, 183.3)))) * 43758.5453); }
  vec3 fabricAt(vec2 t, vec2 gx, vec2 gy) {                         // t: uv / repeat (tile units)
    if (uAntiTile < 0.5) return cin(textureGrad(uFabric, t, gx, gy)).rgb;
    // 1 hex cell per tile (2 per tile cut more vines at the cell borders in the offline test), skewed triangle grid
    vec2 sk = mat2(1.0, 0.0, -0.57735027, 1.15470054) * (t * 3.4641016);
    vec2 base = floor(sk);
    vec3 f = vec3(fract(sk), 0.0);
    f.z = 1.0 - f.x - f.y;
    float sgn = step(0.0, -f.z), s2 = 2.0 * sgn - 1.0;
    vec3 w = vec3(-f.z * s2, sgn - f.y * s2, sgn - f.x * s2);       // barycentric, sums to 1
    vec2 v1 = base + vec2(sgn), v2 = base + vec2(sgn, 1.0 - sgn), v3 = base + vec2(1.0 - sgn, sgn);
    vec3 c1 = cin(textureGrad(uFabric, t + hash2(v1), gx, gy)).rgb;
    vec3 c2 = cin(textureGrad(uFabric, t + hash2(v2), gx, gy)).rgb;
    vec3 c3 = cin(textureGrad(uFabric, t + hash2(v3), gx, gy)).rgb;
    vec3 mean = cin(textureLod(uFabric, vec2(0.5), 20.0)).rgb;       // top mip = the mean colour of the swatch
    w = pow(w, vec3(7.0));
    w /= (w.x + w.y + w.z);                                          // narrow blend zones
    vec3 c = w.x * c1 + w.y * c2 + w.z * c3;
    return clamp(mean + (c - mean) / sqrt(dot(w, w)), 0.0, 1.0);     // keep the contrast of the motifs in the blend zones
  }

  // nearest point on a 24-point polyline: distance, segment, parameter (one function per curve: GLSL has no array references)
  ${["NE", "NE0", "NC"].map((n) => `
  float near${n}(vec2 q, out int si, out float st, out float traw) {
    float best = 1e9; si = 0; st = 0.0; traw = 0.0;
    for (int i = 0; i < 23; i++) {
      vec2 a = u${n}[i], ab = u${n}[i + 1] - a;
      float tr = dot(q - a, ab) / max(dot(ab, ab), 1e-6);
      float t = clamp(tr, 0.0, 1.0);
      float d = distance(q, a + ab * t);
      if (d < best) { best = d; si = i; st = t; traw = tr; }
    }
    return best;
  }
  // signed distance to an edge curve: + on the garment side (below the curve, or beside it, out past the corners)
  float sd${n}(vec2 q, out int si, out float st) {
    float tr;
    float d = near${n}(q, si, st, tr);
    if (q.x <= u${n}[0].x || q.x >= u${n}[23].x) return d;
    for (int i = 0; i < 23; i++) {
      vec2 a = u${n}[i], b = u${n}[i + 1];
      if (q.x >= a.x && q.x <= b.x) return q.y > mix(a.y, b.y, (q.x - a.x) / max(b.x - a.x, 1e-6)) ? d : -d;
    }
    return d;
  }`).join("")}

  // ---- step 3: fine detail of the dress form at q (plate px): hex tiling of the form patch, offsets only (the weave keeps its
  // direction), cells of 0.35 patch, each cell reads the patch around its own random point; zero-mean detail, so the blend
  // only needs the contrast correction
  vec3 hp(vec2 q) { vec2 s = (q + 0.5) / uPlate; return cin(texture(uPhoto, s)).rgb - cin(textureLod(uPhoto, s, 2.0)).rgb; }
  vec3 formDetail(vec2 q) {
    vec2 pc = 0.5 * (uFormPatch.xy + uFormPatch.zw);
    float P = min(uFormPatch.z - uFormPatch.x, uFormPatch.w - uFormPatch.y), c = 0.35 * P;
    mat2 M = mat2(1.0, 0.0, -0.57735027, 1.15470054), Mi = inverse(M);
    vec2 sk = M * (q / c), base = floor(sk);
    vec3 f = vec3(fract(sk), 0.0);
    f.z = 1.0 - f.x - f.y;
    float sgn = step(0.0, -f.z), s2 = 2.0 * sgn - 1.0;
    vec3 w = vec3(-f.z * s2, sgn - f.y * s2, sgn - f.x * s2);
    vec2 v1 = base + vec2(sgn), v2 = base + vec2(sgn, 1.0 - sgn), v3 = base + vec2(1.0 - sgn, sgn);
    vec2 lo = uFormPatch.xy + 1.0, hi = uFormPatch.zw - 2.0;
    vec3 d1 = hp(clamp(pc + q - Mi * v1 * c + (hash2(v1) - 0.5) * 0.24 * P, lo, hi));
    vec3 d2 = hp(clamp(pc + q - Mi * v2 * c + (hash2(v2) - 0.5) * 0.24 * P, lo, hi));
    vec3 d3 = hp(clamp(pc + q - Mi * v3 * c + (hash2(v3) - 0.5) * 0.24 * P, lo, hi));
    w = pow(w, vec3(4.0));
    w /= (w.x + w.y + w.z);
    return (w.x * d1 + w.y * d2 + w.z * d3) / sqrt(dot(w, w));
  }

  void main() {
    vec2 frag = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);   // top-left origin
    vec2 st = frag / uCanvas;
    vec4 photo = cin(texture(uPhoto, st));
    if (uPhotoOnly > 0.5) { outColor = vec4(uLinear > 0.5 ? toSRGB(photo.rgb) : photo.rgb, 1.0); return; }

    float k = uPlate.x / uCanvas.x;                                  // plate px per canvas px
    ivec2 p = ivec2(min(floor(frag * k), uPlate - 1.0));
    vec4 idt = texelFetch(uId, p, 0);
    int zone = int(idt.r * 255.0 + 0.5);
    int trim = int(idt.g * 255.0 + 0.5);

    // ---- live neckline (halfway.md step 2): in the neck area the garment is what lies below the LIVE edge
    bool neckA = uNeckLive > 0.5 && idt.b > 0.0;
    vec2 fpx = frag * k - 0.5;                                       // plate px; integer = pixel centre (as PIL draws the maps)
    float dL = 1e3, dO = 1e3, covE = 1.0;                            // signed distance to the live / photographed edge (+ = garment)
    int eI = 0, oI = 0;
    float eT = 0.0, oT = 0.0;
    vec3 under = photo.rgb;                                          // what shows where there is no garment
    bool liveTrim = false;                                           // step 5: the neck trim of this pixel comes from the live curve
    vec2 tLive = vec2(0.0), tT = vec2(1.0, 0.0), tN = vec2(0.0, -1.0);
    if (neckA) {
      dL = sdNE(fpx, eI, eT);
      dO = sdNE0(fpx, oI, oT);
      covE = clamp(0.5 + dL / k, 0.0, 1.0);                          // analytic edge coverage (canvas px)
      zone = covE > 0.0 ? 1 : 0;
      // ---- step 5: the neck trim from the live trim centre line, as the plate maker writes it: u = cm along the centre line,
      // v = 0.5 + offset toward the edge / trim width (0 inner side, 1 the garment edge). The baked neck trim is not used here.
      if (trim == 1) trim = 0;
      if (zone == 1 && uTrimOn[1] > 0.5) {
        float best = 1e9, acc = 0.0, bacc = 0.0, btr = 0.5;
        int bi = 0;
        for (int i = 0; i < 23; i++) {
          vec2 a = uNC[i], ab = uNC[i + 1] - a;
          float sl = length(ab), tr = dot(fpx - a, ab) / max(sl * sl, 1e-6);
          float d = distance(fpx, a + ab * clamp(tr, 0.0, 1.0));
          if (d < best) { best = d; bi = i; btr = tr; bacc = acc + sl * clamp(tr, 0.0, 1.0); }
          acc += sl;
        }
        vec2 ab = uNC[bi + 1] - uNC[bi];
        tT = normalize(ab);
        tN = vec2(tT.y, -tT.x);                                      // toward the edge (up, for a curve drawn left to right)
        float v = 0.5 + dot(fpx - (uNC[bi] + ab * clamp(btr, 0.0, 1.0)), tN) / uNeckTw;
        bool ends = (bi == 0 && btr < 0.0) || (bi == 22 && btr > 1.0); // past the ends of the strip: no trim (as the plate)
        // +0.95 px: the plate maker draws the strip quad after quad, each with a 1 px outline, so a px on the border of two quads
        // takes the later quad's u: the baked u runs 0.9-1.0 px ahead of the exact arc (tools/trim_match.py). Same convention here.
        if (!ends && v >= 0.0 && v <= 1.0) { liveTrim = true; trim = 1; tLive = vec2((bacc + 0.95) * uCmPerPx, v * uRange); }
      }
      if (dO - dL > 0.25 && dO > -8.5 / (uCmPerPx * 10.0)) {         // was garment in the photo (or its edge), is form now
        if (uRevealFill < 0.5) {
          if (dO > -1.0) under = uLinear > 0.5 ? toLin(uFormRGB) : uFormRGB;   // ?revealfill=0: plain colour
        } else {
          // step 3: the dress form. Colour: the patch mean, times the light of the photo's form just ABOVE the photographed
          // edge at this place along it (a ratio, 0.85-1.15: the light carries on, a stray dark spot does not). Detail: the
          // patch, hex tiled (formDetail). Centre-front tape: the photo's column just above the edge, averaged over 4 heights
          // (a vertical line stays, the weave does not), carried straight down within 10 mm of the centre front.
          // The first g mm above the photographed edge (its contact shadow) are replaced, and the next 4 mm fade: no line there.
          float mmpp = uCmPerPx * 10.0;
          vec2 a0 = uNE0[oI], b0 = uNE0[oI + 1];
          vec2 op = mix(a0, b0, oT), t0 = normalize(b0 - a0), nOut = vec2(t0.y, -t0.x);
          float g = 4.0 / mmpp, F = 8.0 / mmpp;
          vec2 pc = 0.5 * (uFormPatch.xy + uFormPatch.zw);
          float P = min(uFormPatch.z - uFormPatch.x, uFormPatch.w - uFormPatch.y);
          vec3 mean = vec3(0.0);                                     // 9 taps inside the patch (a coarse mip would reach the garment)
          for (int j = -1; j <= 1; j++)
            for (int i = -1; i <= 1; i++)
              mean += cin(textureLod(uPhoto, (pc + vec2(i, j) * 0.3 * P + 0.5) / uPlate, log2(0.15 * P))).rgb;
          mean /= 9.0;
          vec3 loc = cin(textureLod(uPhoto, (op + nOut * (g + 0.5 * F) + 0.5) / uPlate, log2(0.4 * F))).rgb;
          float lum = dot(loc, vec3(0.2126, 0.7152, 0.0722)) / max(dot(mean, vec3(0.2126, 0.7152, 0.0722)), 1e-3);
          vec3 det = 1.2 * formDetail(fpx);                         // a little more: the patch is the calmer side
          float wc = 1.0 - smoothstep(4.0, 10.0, abs(fpx.x - uCfX.x) * mmpp);
          if (wc > 0.0) {
            float ye = op.y - g;                                       // just above the photographed edge, in this column
            vec3 ln = vec3(0.0);
            for (int j = 0; j < 4; j++) ln += hp(vec2(fpx.x, ye - float(j) * 2.0 / mmpp));
            det += wc * ln * 0.25;
          }
          float sh = mix(0.84, 1.0, smoothstep(0.0, 5.0 / mmpp, -dL));      // the garment edge shades the form below it
          // the local colour of the form (its light and hue at this place); only when it strays more than 15 % from the patch
          // mean, an ADDED share of the patch colour brings it back (scaling a dark warm colour up would turn it orange)
          vec3 fill = max((loc + mean * (clamp(lum, 0.85, 1.15) - lum)) * sh + det, 0.0);
          float mv = smoothstep(0.5, 3.0, distance(mix(uNE[eI], uNE[eI + 1], eT), mix(uNE0[eI], uNE0[eI + 1], eT)));
          under = mix(photo.rgb, fill, smoothstep(-g - 4.0 / mmpp, -0.2 * g, dO) * mv);   // 8 mm fade: the old collar shadow goes softly
        }
      }
    }

    bool bg = zone == 0;                                             // wall, form, stand: only an edging overhang is drawn here
    if (bg && !(trim > 0 && uTrimOn[trim] > 0.5 && uTrimEdging[trim] > 0.5)) {
      outColor = vec4(uLinear > 0.5 ? toSRGB(under) : under, 1.0); return;
    }

    // Canvas bigger than the plate (k < 1): interpolate between the 4 nearest plate texels,
    // but only when they are all in the same zone (or trim). Otherwise: nearest texel, so
    // zone edges stay sharp and no UV is mixed across a jump.
    bool up = k < 0.999;
    ivec2 mx = ivec2(uPlate) - 1;
    vec2 fp = frag * k - 0.5;
    ivec2 q0 = ivec2(floor(fp));
    vec2 fr = fp - vec2(q0);
    ivec2 q00 = clamp(q0, ivec2(0), mx), q10 = clamp(q0 + ivec2(1, 0), ivec2(0), mx);
    ivec2 q01 = clamp(q0 + ivec2(0, 1), ivec2(0), mx), q11 = clamp(q0 + ivec2(1, 1), ivec2(0), mx);
    vec4 i00 = texelFetch(uId, q00, 0), i10 = texelFetch(uId, q10, 0);
    vec4 i01 = texelFetch(uId, q01, 0), i11 = texelFetch(uId, q11, 0);
    vec4 wq = vec4((1.0 - fr.x) * (1.0 - fr.y), fr.x * (1.0 - fr.y), (1.0 - fr.x) * fr.y, fr.x * fr.y);

    // soft edge
    float cov = 0.0;
    // in the neck area the whole grid counts (B = 1): the live edge cuts it (covE); elsewhere the baked zones
    float nb = neckA ? 1.0 : 0.0;
    if (bg) cov = 1.0;                                               // overhang: the lace alpha does the edge
    else if (up) {
      cov = dot(wq, vec4(i00.r > 0.0 || nb * i00.b > 0.0 ? 1.0 : 0.0, i10.r > 0.0 || nb * i10.b > 0.0 ? 1.0 : 0.0,
                         i01.r > 0.0 || nb * i01.b > 0.0 ? 1.0 : 0.0, i11.r > 0.0 || nb * i11.b > 0.0 ? 1.0 : 0.0));
    } else {                                                          // share of garment px in a 3x3 block
      for (int dy = -1; dy <= 1; dy++)
        for (int dx = -1; dx <= 1; dx++) {
          vec4 tq = texelFetch(uId, clamp(p + ivec2(dx, dy), ivec2(0), mx), 0);
          cov += tq.r > 0.0 || nb * tq.b > 0.0 ? 1.0 : 0.0;
        }
      cov /= 9.0;
    }
    if (neckA) cov = min(cov, covE);

    float s = shadeOf(up ? texture(uShade, st).r : texelFetch(uShade, p, 0).r);   // 1.0 = normal light
    if (uShadeOn < 0.5) s = 1.0;
    // fabric where the photo shows the form (shallower setting): the photo has no garment light there
    bool revealed = neckA && dL - dO > 0.25 && dO < 0.0;
    vec3 toile = uLinear > 0.5 ? toLin(uToileRGB) : uToileRGB;
    if (revealed && uRevealFill < 0.5) s = 1.0;
    vec3 toileCol = revealed ? toile * s : photo.rgb;                // fabric off: the photo, or the toile where it shows the form
    if (neckA && uRevealFill > 0.5 && zone == 1) {
      // ---- step 3: the edge band follows the live edge, and fabric that the photo did not have gets a smooth light.
      // Band (9 mm from the live edge): shade and photo from the photographed edge band at the same distance (edge roll,

    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
    h.addEventListener("keydown", (e) => {
      if (!neckGeo) return;
      const pv = h.dataset.pivot, key = pv === "cf" ? "depthMm" : "widthMm", r = look.neck[key];
      const dir = { cf: { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 },
                    l: { ArrowLeft: 1, ArrowUp: 1, ArrowRight: -1, ArrowDown: -1 },
                    r: { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 } }[pv][e.key];
      let v = state.neck[key];
      if (dir) v = Math.round((v + dir * (e.shiftKey ? r.bigStep : r.step)) * 10) / 10;
      else if (e.key === "Home") v = r.min;
      else if (e.key === "End") v = r.max;
      else if (e.key === "PageDown") v = r.stops.find((s) => s > v + 0.05) ?? r.max;
      else if (e.key === "PageUp") v = [...r.stops].reverse().find((s) => s < v - 0.05) ?? r.min;
      else return;
      e.preventDefault();
      applyNeck({ [key]: v });
      writeURL();
    });
  }
  document.getElementById("neck-reset").addEventListener("click", () => {
    if (!look) return;
    applyNeck({ depthMm: look.neck.depthMm.default, widthMm: look.neck.widthMm.default });
    writeURL();
  });
  document.getElementById("neck-snap").addEventListener("click", (e) => {
    snapOn = !snapOn;
    e.currentTarget.setAttribute("aria-pressed", String(snapOn));
  });
  document.getElementById("neck-snap").setAttribute("aria-pressed", String(snapOn));

  async function loadShared() {                        // samplers and swatches: once for all views
    ["uPhoto", "uId", "uUV", "uUVT", "uShade", "uFabric", "uLace", "uLaceMat"].forEach((n, i) => gl.uniform1i(U(n), i));
    gl.uniform1f(U("uMipBias"), MIP_BIAS);
    gl.uniform1f(U("uAniso"), USE_PLATE_GRAD);
    gl.uniform1f(U("uShadeOn"), SHADE_ON);
    gl.uniform1f(U("uShadowStrength"), SHADOW);
    gl.uniform1f(U("uRelief"), RELIEF);
    gl.uniform1f(U("uDisplaceMm"), DISPLACE);
    gl.uniform1f(U("uLinear"), LINEAR);
    gl.uniform1f(U("uSrgbTex"), SRGB_TEX);
    gl.uniform2f(U("uShadowMm"), 0.6, 0.9);
    look = await fetch("assets/looks/straight-kurta.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
    if (look) {                                        // the design record; ?neckDepth=110&neckWidth=165 for tests
      const L = look.neck;
      state.neck = clampNeck({ depthMm: params0.get("neckDepth") ?? L.depthMm.default, widthMm: params0.get("neckWidth") ?? L.widthMm.default });
    }
    await Promise.all([setFabric(state.fabric), setLace(state.lace)]);
    gl.uniform1fv(U("uTrimFit"), new Float32Array(9).fill(1));
  }

  const builtMapsFor = (view) => meshOn(view) && builtMaps && builtMaps.uvt;
  let builtMaps = null;                               // { id, uv, ms } of the current view when it was built from the mesh
  const MESH_CELL = params0.has("cell") ? parseFloat(params0.get("cell")) : 4;   // test: ?cell=<px> grid cell of the meshes
  const MESH_OFF = params0.has("mapoff") ? (([a, b, c, d, g]) => ({ idOff: [a, b], uvOff: [c, d], grow: g }))(params0.get("mapoff").split(",").map(parseFloat)) : {};   // test: ?mapoff=idx,idy,uvx,uvy,grow
  let switchToken = 0;
  // step 7: a step change cross-fades (250 ms) from a still of the old view; none with prefers-reduced-motion
  const fadeCv = document.getElementById("fade");
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
  let freezeToken = 0;                                 // a newer still wins over a fade-out that is still pending
  function freeze() {                                  // the current frame, held above the canvas
    freezeToken++;
    if (!canvas.classList.contains("ready") || !canvas.width) return;
    fadeCv.width = canvas.width; fadeCv.height = canvas.height;
    fadeCv.getContext("2d").drawImage(canvas, 0, 0);
    fadeCv.classList.remove("fading");
    fadeCv.style.opacity = "1";
  }
  function unfreeze() {
    if (fadeCv.style.opacity !== "1") return;
    const tok = freezeToken;
    requestAnimationFrame(() => {
      if (tok !== freezeToken) return;
      if (REDUCED.matches) { fadeCv.style.opacity = "0"; return; }
      fadeCv.classList.add("fading");
      fadeCv.style.opacity = "0";
    });
  }
  async function showView(view, { fade = true } = {}) {
    const token = ++switchToken;
    const t0 = performance.now();
    if (fade) freeze();
    const v = await fetchView(view);
    if (token !== switchToken) return;                 // a later click won
    const ph = [performance.now()];                    // phase marks (test hook): fetched, decoded, built, uploaded, first draw
    const bm = await decodeView(view, v);              // decode this view only (step 1)
    ph.push(performance.now());
    if (token !== switchToken) { if (!DECODE_ALL) Object.values(bm).forEach(release); return; }
    setUnit(0, bm.photo);
    if (meshOn(view)) {                                // the maps from the curves (numeric.md): id R / B and uv; G, uvt, shade still PNG
      const built = Maps.build(gl, { plate: v.plate, Z: Plate.prepare(v.zones), photo: MESH_SHADE ? bm.photo : null, sync: params0.get("syncbuild") === "1", cell: MESH_CELL, ...MESH_OFF });
      ph.push(performance.now());
      setUnitTex(1, built.id);
      setUnitTex(2, built.uv);
      stat.dataset.build = built.ms.toFixed(1);
      builtMaps = built;
    } else {
      setUnit(1, bm.id, { data: true });
      setUnit(2, bm.uv, { data: true });
      stat.dataset.build = "";
      builtMaps = null;
    }
    if (builtMapsFor(view)) setUnitTex(3, builtMaps.uvt); else setUnit(3, bm.uvt, { data: true });
    if (builtMaps && builtMaps.shade) setUnitTex(4, builtMaps.shade); else setUnit(4, bm.shade, { data: true, linear: true }); // texelFetch ignores the filter: one texture for exact and smooth reads
    Object.values(bm).forEach(release);                // on the GPU now: free the decoded images
    plate = v.plate;
    note.classList.remove("show");
    gl.uniform2f(U("uPlate"), plate.viewBox[0], plate.viewBox[1]);
    gl.uniform1f(U("uCmPerPx"), plate.mmPerPx / 10);
    gl.uniform1f(U("uRange"), plate.uvRangeCm);
    gl.uniform1f(U("uShadeSqrt"), plate.shadeEncoding === "sqrt" ? 1 : 0);
    gl.uniform1f(U("uShadeMed"), (plate.shadeMedian || 213) / 255);
    const w = new Float32Array(9), flip = new Float32Array(9);
    const viewFlip = VIEW_FLIP[view] || FLIP;
    for (const [name, id] of Object.entries(TRIMS)) {
      w[id] = (plate.trims[name]?.widthMm ?? 20) / 10;
      // new plates orient V themselves (outerV = 1: 0 inner side, 1 garment edge); old plates use the FLIP table
      flip[id] = plate.trims[name]?.outerV !== undefined ? 0 : (viewFlip[name] || 0);
    }
    gl.uniform1fv(U("uTrimWcm"), w);
    gl.uniform1fv(U("uTrimFlip"), flip);
    neckSetup();
    neckUpload();
    laceFit();
    // trim pills: only the trims this view shows
    document.querySelectorAll("[data-trim]").forEach((b) => {
      b.hidden = !GROUP[b.dataset.trim].some((n) => plate.trims[n]);
    });
    stageImg.src = VIEWS[view].plate + "base.jpg";    // fallback photo under the canvas
    stat.dataset.load = Math.round(performance.now() - t0);
    ph.push(performance.now());
    canvas.width = 0;                                  // force resize() to set the canvas for this plate
    resize();
    ph.push(performance.now());
    stat.dataset.phases = ph.slice(1).map((t, i) => Math.round(t - ph[i])).join(",");   // decode, build, set up, draw (ms)
    canvas.classList.add("ready");
    stat.dataset.show = Math.round(performance.now() - t0);
    if (fade) unfreeze();
  }

  async function load() {
    await loadShared();
    state.view = STEPS[state.step].view;               // the step decides the view (?view= still works: it picks the step)
    await showView(state.view, { fade: false });
    visited.add(state.step);
    if (state.step === "review") await buildReview();
    // preload the other views in idle time
    const idle = window.requestIdleCallback || ((f) => setTimeout(f, 300));
    idle(() => {
      Object.keys(VIEWS).forEach((k) => fetchView(k).catch(() => {}));
      [...Object.values(FABRICS), ...Object.values(LACES)].forEach((x) => swatch(x.src).catch(() => {}));
    });
  }

  // ---------- draw (only on change)
  function render() {
    const on = new Float32Array(9);
    for (const [group, names] of Object.entries(GROUP))
      for (const n of names) on[TRIMS[n]] = state.trims[group] ? 1 : 0;
    gl.uniform1fv(U("uTrimOn"), on);
    gl.uniform1f(U("uFabricOn"), state.fabric === "off" ? 0 : 1);
    gl.uniform1f(U("uChecker"), state.checker ? 1 : 0);
    gl.uniform1f(U("uPhotoOnly"), state.photo ? 1 : 0);
    const t0 = performance.now();
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    stat.textContent = `Load ${stat.dataset.load} ms · draw ${(performance.now() - t0).toFixed(1)} ms · ${canvas.width}×${canvas.height}`;
    canvas.setAttribute("aria-label", describe());
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(plate.viewBox[0] * 2, Math.round(r.width * dpr));   // up to 2x the plate
    const h = Math.round(w * plate.viewBox[1] / plate.viewBox[0]);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(U("uCanvas"), w, h);
    }
    render();
    railsDraw();
    pivotsUpdate();
  }

  function describe() {
    const parts = [state.fabric === "off" ? "Plain white straight kurta" : `Straight kurta in ${FABRICS[state.fabric].name.toLowerCase()}`];
    const on = Object.entries(state.trims).filter(([, v]) => v).map(([k]) => ({ neck: "neckline", cuffs: "cuffs", hem: "hem", slits: "slits" })[k]);
    if (on.length) parts.push(`${LACES[state.lace].name.toLowerCase()} on the ${on.join(", ")}`);
    return `View: ${VIEWS[state.view].name}. ` + parts.join(", with ") + ".";
  }

  // ---------- journey (halfway.md step 7): one step = one fixed view; the panel shows the sections of the step
  const STEPS = {
    cloth:  { view: "torso",  sections: ["fabric"] },
    neck:   { view: "neck",   sections: ["lace", "neckline"] },
    sleeve: { view: "sleeve", sections: ["lace"] },
    hem:    { view: "hem",    sections: ["lace"] },
    review: { view: "torso",  sections: ["review"] },
  };
  const STEP_OF_VIEW = { torso: "cloth", neck: "neck", sleeve: "sleeve", hem: "hem" };
  const ORDER = Object.keys(STEPS);
  const SHOW_TEST = params0.has("test");
  state.step = STEPS[params0.get("step")] ? params0.get("step") : STEP_OF_VIEW[state.view];
  const visited = new Set();
  function stepUI() {
    document.querySelectorAll("[data-step]").forEach((b) => {
      if (b.dataset.step === state.step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", visited.has(b.dataset.step));
    });
    const secs = STEPS[state.step].sections;
    document.querySelectorAll("[data-section]").forEach((d) => { d.hidden = d.dataset.section === "test" ? !SHOW_TEST : !secs.includes(d.dataset.section); });
    document.getElementById("review-strip").hidden = state.step !== "review";
    const i = ORDER.indexOf(state.step);
    document.getElementById("prev-step").hidden = i === 0;
    const next = document.getElementById("next-step");
    next.hidden = i === ORDER.length - 1;
    next.textContent = i === ORDER.length - 2 ? "Review" : `Next: ${document.querySelector(`[data-step="${ORDER[i + 1]}"]`)?.textContent.replace(/^\d/, "") || ""}`;
  }
  async function setStep(step) {
    if (!STEPS[step]) return;
    visited.add(state.step);
    state.step = step;
    stepUI();
    const view = STEPS[step].view;
    const t0 = performance.now();
    if (view !== state.view || !plate) {
      state.view = view;
      await showView(view);
    } else pivotsUpdate();
    if (step === "review") await buildReview();
    stat.dataset.step = Math.round(performance.now() - t0);
    const q = new URLSearchParams(location.search);    // the step in the URL (a reload opens it again)
    q.delete("view"); q.set("step", step);
    history.replaceState(null, "", `${location.pathname}?${q}`);
  }
  document.querySelector(".journey").addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]");
    if (b && b.dataset.step !== state.step) setStep(b.dataset.step).catch((err) => { console.error(err); fail("The view did not load: " + err.message); });
  });
  document.getElementById("next-step").addEventListener("click", () => setStep(ORDER[ORDER.indexOf(state.step) + 1]));
  document.getElementById("prev-step").addEventListener("click", () => setStep(ORDER[ORDER.indexOf(state.step) - 1]));
  stepUI();

  // ---------- highlight (step 7): the part that was just selected glows softly for about 1 s
  let glowRaf = 0;
  function glow({ trims = [], neck = false }) {
    if (!plate) return;
    const on = new Float32Array(9);
    trims.forEach((n) => { if (TRIMS[n]) on[TRIMS[n]] = 1; });
    gl.uniform1fv(U("uGlowTrim"), on);
    gl.uniform1f(U("uGlowNeck"), neck ? 1 : 0);
    cancelAnimationFrame(glowRaf);
    const t0 = performance.now();
    const step = () => {
      const t = (performance.now() - t0) / 1000;
      // a soft rise and fall; with reduced motion: on for 1 s, then off (two frames)
      const a = t >= 1 ? 0 : REDUCED.matches ? 0.6 : 0.75 * Math.sin(Math.PI * Math.min(1, t));
      gl.uniform1f(U("uGlow"), a);
      render();
      if (t < 1) glowRaf = REDUCED.matches ? setTimeout(() => requestAnimationFrame(step), 1000) : requestAnimationFrame(step);
    };
    step();
  }

  // ---------- before / after (step 7): hold the button or the space key to see the plain garment (the photo)
  const beforeBtn = document.getElementById("before");
  function before(on) {
    if (state.photo === on) return;
    state.photo = on;
    beforeBtn.setAttribute("aria-pressed", String(on));
    svg.style.visibility = on ? "hidden" : "";
    if (plate) render();
  }
  beforeBtn.addEventListener("pointerdown", (e) => { beforeBtn.setPointerCapture(e.pointerId); before(true); e.preventDefault(); });
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) beforeBtn.addEventListener(t, () => before(false));
  beforeBtn.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { before(true); e.preventDefault(); } });
  beforeBtn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") before(false); });
  document.addEventListener("keydown", (e) => {        // the space key anywhere that is not a control
    if (e.key !== " " || e.repeat || e.target.closest("button, input, [role=slider], a, textarea, select")) return;
    e.preventDefault(); before(true);
  });
  document.addEventListener("keyup", (e) => { if (e.key === " " && !e.target.closest("button, input, textarea, select")) before(false); });

  // ---------- review (step 7): the torso view large, the 3 close views from the same record, the list of choices
  let reviewKey = "";
  const choicesText = () => {
    const on = Object.entries(state.trims).filter(([, v]) => v).map(([k]) => ({ neck: "neckline", cuffs: "sleeve cuffs", hem: "hem border", slits: "chaak slits" })[k]);
    return [
      ["Cloth", state.fabric === "off" ? "Original white toile" : FABRICS[state.fabric].name],
      ["Lace", on.length ? LACES[state.lace].name : "No lace"],
      ["Placement", on.length ? on.join(", ") : "none"],
      ["Neckline", state.neck ? `${fmt(state.neck.depthMm)} deep, ${fmt(state.neck.widthMm)} wide` : "as photographed"],
    ];
  };
  async function buildReview() {
    const list = document.getElementById("review-list");
    list.textContent = "";
    for (const [k, v] of choicesText()) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; list.append(dt, dd); }
    const key = JSON.stringify([state.fabric, state.lace, state.trims, state.neck]);
    if (key === reviewKey) return;
    // the 3 close views: drawn one after the other on the stage canvas (behind a still of the torso), copied to the strip.
    // First let the step's own cross-fade finish (the torso shows at once; the strip fills in after).
    await new Promise((r) => setTimeout(r, REDUCED.matches ? 0 : 280));
    freeze();
    for (const v of ["neck", "sleeve", "hem"]) {
      state.view = v;
      await showView(v, { fade: false });
      const th = document.querySelector(`[data-thumb="${v}"]`);
      th.getContext("2d").drawImage(canvas, 0, 0, th.width, th.height);
    }
    state.view = "torso";
    await showView("torso", { fade: false });
    unfreeze();
    reviewKey = key;
  }
  // share image: one PNG of the review (torso large, the 3 close views, the choices), from the canvases (toBlob)
  async function reviewImage() {
    if (state.step !== "review") await setStep("review");
    const W = 1080, H = 1500, M = 48, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.fillStyle = "#f6f1e9"; x.fillRect(0, 0, W, H);
    const big = [M, 112, 600, 800];
    x.drawImage(canvas, ...big);
    x.fillStyle = "#1d1a16"; x.font = "500 40px Helvetica Neue, Arial, sans-serif"; x.fillText("Your kurta", M, 78);
    let y = 150;
    for (const [k, v] of choicesText()) {
      x.fillStyle = "#6f675d"; x.font = "500 20px Helvetica Neue, Arial, sans-serif"; x.fillText(k.toUpperCase(), 680, y);
      x.fillStyle = "#1d1a16"; x.font = "28px Helvetica Neue, Arial, sans-serif";
      const words = v.split(" "); let line = "";
      for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > W - 680 - M) { x.fillText(line, 680, y + 38); y += 36; line = w; } else line = t; }
      x.fillText(line, 680, y + 38); y += 110;
    }
    const tw = (W - 2 * M - 2 * 24) / 3, th = tw * 4 / 3;
    ["neck", "sleeve", "hem"].forEach((v, i) => x.drawImage(document.querySelector(`[data-thumb="${v}"]`), M + i * (tw + 24), 112 + 800 + 40, tw, th));
    x.fillStyle = "#6f675d"; x.font = "20px Helvetica Neue, Arial, sans-serif";
    x.fillText("Atelier Studio · live preview from the studio photographs", M, H - 40);
    return new Promise((res) => c.toBlob(res, "image/png"));
  }
  async function saveBlob(blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "my-kurta.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  document.getElementById("download").addEventListener("click", async () => saveBlob(await reviewImage()));
  document.getElementById("share").addEventListener("click", async () => {
    const blob = await reviewImage(), file = new File([blob], "my-kurta.png", { type: "image/png" });
    const hint = document.getElementById("share-hint");
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "My kurta" }); hint.textContent = ""; }
      catch (err) { if (err.name !== "AbortError") hint.textContent = "Sharing did not work here; the image was downloaded instead."; if (err.name !== "AbortError") saveBlob(blob); }
    } else { saveBlob(blob); hint.textContent = "This browser cannot share files: the image was downloaded (send it on WhatsApp from there)."; }
  });

  document.querySelectorAll("[data-fabric]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.fabric === state.fabric)));
  document.querySelectorAll("[data-lace]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lace === state.lace)));
  document.getElementById("caption-fabric").textContent = state.fabric === "off" ? "Plain White Toile" : FABRICS[state.fabric].name;
  document.getElementById("caption-trim").textContent = LACES[state.lace].name;

  // ---------- controls
  document.querySelector('[data-group="fabric"]').addEventListener("click", (e) => {
    const b = e.target.closest("[data-fabric]");
    if (!b) return;
    state.fabric = b.dataset.fabric;
    b.parentElement.querySelectorAll("[data-fabric]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("caption-fabric").textContent = state.fabric === "off" ? "Plain White Toile" : FABRICS[state.fabric].name;
    setFabric(state.fabric).then(() => plate && render()).catch((err) => fail("The fabric did not load: " + err.message));
  });
  document.querySelector('[data-group="lace"]').addEventListener("click", (e) => {
    const b = e.target.closest("[data-lace]");
    if (!b || b.dataset.lace === state.lace) return;
    state.lace = b.dataset.lace;
    b.parentElement.querySelectorAll("[data-lace]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const any = Object.values(state.trims).some(Boolean);
    document.getElementById("caption-trim").textContent = any ? LACES[state.lace].name : "No Lace";
    setLace(state.lace).then(() => plate && render()).catch((err) => fail("The lace did not load: " + err.message));
  });
  document.querySelectorAll("[data-trim]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.trim;
    state.trims[k] = !state.trims[k];
    b.setAttribute("aria-pressed", String(state.trims[k]));
    const any = Object.values(state.trims).some(Boolean);
    document.getElementById("caption-trim").textContent = any ? LACES[state.lace].name : "No Lace";
    if (plate) { if (state.trims[k]) glow({ trims: GROUP[k] }); else render(); }
  }));
  document.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.test;
    state[k] = !state[k];
    b.setAttribute("aria-pressed", String(state[k]));
    if (plate) render();
  }));

  // test hook for tools/cdp_shot.mjs --eval (no UI use)
  window.__studio = {
    state, showView, render: () => plate && render(),
    setNeck: (rec) => { state.neck = clampNeck({ ...state.neck, ...rec }); neckUpload(); render(); return state.neck; },
    neckCurves: () => neckGeo && neckCurves(state.neck), neckGeo: () => neckGeo, neckSent: () => neckGeo && neckGeo.sent,
    decodedBytes: () => [...decoded].reduce((n, b) => n + b.width * b.height * 4, 0),
    decodedCount: () => decoded.size,
    buildMs: () => (stat.dataset.build ? +stat.dataset.build : null),
    readMaps: () => (builtMaps ? Object.fromEntries(["id", "uv", "uvt", "shade"].filter((k) => builtMaps[k]).map((k) => [k, Maps.readPNG(gl, builtMaps[k], plate.viewBox[0], plate.viewBox[1])])) : null),
    setStep, reviewImage: async () => { const b = await reviewImage(); return new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); },
    timings: () => ({ show: +stat.dataset.show, step: +stat.dataset.step, phases: stat.dataset.phases }),
  };

  let raf = 0;
  new ResizeObserver(() => { if (plate) { cancelAnimationFrame(raf); raf = requestAnimationFrame(resize); } }).observe(canvas);

  load().catch((err) => { console.error(err); fail("The plate did not load: " + err.message); });
})();
</script>
</body>
</html>

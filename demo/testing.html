<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Studio — Live Garment Preview</title>
<!--
  Test page for one pre-made plate (torso view, straight kurta).
  WebGL2, one full-screen triangle, one fragment shader, no libraries.
  It draws only when a choice changes (no animation loop).

  Needs an HTTP server (WebGL cannot read images from file://):
    cd myshoppe/demo && python3 -m http.server 8000   →  http://localhost:8000/testing.html
-->
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fbf8f3;
    --ink: #1d1a16;
    --muted: #6f675d;
    --line: rgba(29, 26, 22, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
  }
  .studio-shell {
    display: grid;
    grid-template-columns: minmax(320px, 430px) minmax(280px, 360px);
    gap: 40px;
    align-items: start;
    max-width: 860px;
    width: 100%;
  }
  @media (max-width: 760px) {
    body { padding: 16px; }
    .studio-shell { grid-template-columns: 1fr; gap: 24px; }
  }
  /* STUDIO STAGE */
  .stage-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #e5ddd0;
    box-shadow: 0 20px 48px rgba(29, 26, 22, 0.12);
  }
  .stage-frame img,
  .stage-frame canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage-frame canvas { visibility: hidden; }        /* the photo shows until the first frame */
  .stage-frame canvas.ready { visibility: visible; }
  .stage-caption {
    position: absolute;
    bottom: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(251, 248, 243, 0.86);
    backdrop-filter: blur(8px);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .stage-note {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(251, 248, 243, 0.92);
    font-size: 12px;
    line-height: 1.45;
    display: none;
  }
  .stage-note.show { display: block; }
  /* EDITORIAL CONTROLS */
  .panel {
    display: grid;
    gap: 26px;
    padding-top: 8px;
  }
  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .swatch-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.18s;
  }
  .swatch-card[aria-pressed="true"] {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .swatch-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0, 0, 0, 0.12);
    background-size: cover;
    background-position: center;
  }
  .swatch-meta strong {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
  }
  .swatch-meta span {
    font-size: 11px;
    color: var(--muted);
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.16s, color 0.16s, border-color 0.16s;
  }
  .pill[aria-pressed="true"] {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }
  .pill:focus-visible,
  .swatch-card:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .stat {
    font-size: 11px;
    color: var(--muted);
    margin: 10px 0 0;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="studio-shell">
  <!-- LEFT: STAGE — photo underneath (fallback), WebGL canvas on top -->
  <div class="stage-frame">
    <img src="assets/plates/torso-straight/base.jpg" alt="" width="1200" height="1600">
    <canvas id="stage" role="img" aria-label="Straight kurta on a dress form"></canvas>
    <p class="stage-note" id="note"></p>
    <div class="stage-caption">
      <span id="caption-fabric">Sage Embroidered Organza</span>
      <span id="caption-trim">Pearl Guipure Lace</span>
    </div>
  </div>

  <!-- RIGHT: CONTROLS -->
  <div class="panel">
    <div>
      <p class="eyebrow">00 · View</p>
      <div class="pill-row" data-group="view" role="group" aria-label="View">
        <button class="pill" aria-pressed="true" data-view="torso">Full torso</button>
        <button class="pill" aria-pressed="false" data-view="neck">Neckline</button>
        <button class="pill" aria-pressed="false" data-view="sleeve">Shoulder &amp; sleeve</button>
        <button class="pill" aria-pressed="false" data-view="hem">Hem &amp; slit</button>
      </div>
    </div>

    <div>
      <p class="eyebrow">01 · Textile</p>
      <div class="swatch-grid" data-group="fabric">
        <button class="swatch-card" aria-pressed="false" data-fabric="off">
          <span class="swatch-dot" style="background:#f4f1ec"></span>
          <span class="swatch-meta"><strong>Original</strong><span>Plain white toile</span></span>
        </button>
        <button class="swatch-card" aria-pressed="true" data-fabric="sage">
          <span class="swatch-dot" style="background-color:#9fb096; background-image:url('assets/swatches/fabric-sage-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Sage Organza</strong><span>Floral embroidery</span></span>
        </button>
        <button class="swatch-card" aria-pressed="false" data-fabric="mocha">
          <span class="swatch-dot" style="background-color:#8a5a35; background-image:url('assets/swatches/fabric-mocha-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Mocha Chikan</strong><span>Tonal vine embroidery</span></span>
        </button>
        <button class="swatch-card" aria-pressed="false" data-fabric="mustard">
          <span class="swatch-dot" style="background-color:#e0a01e; background-image:url('assets/swatches/fabric-mustard-1024.jpg')"></span>
          <span class="swatch-meta"><strong>Mustard Gauze</strong><span>Crinkled cotton</span></span>
        </button>
      </div>
    </div>

    <div>
      <p class="eyebrow">02 · Lace</p>
      <div class="pill-row" data-group="lace" style="margin-bottom:10px">
        <button class="pill" aria-pressed="true" data-lace="pearl">Pearl guipure</button>
        <button class="pill" aria-pressed="false" data-lace="geometric">Woven diamond</button>
        <button class="pill" aria-pressed="false" data-lace="leaf">Resham bel</button>
        <button class="pill" aria-pressed="false" data-lace="fine">Kiran zari</button>
      </div>
      <p class="eyebrow" style="margin-bottom:8px">Placement</p>
      <div class="pill-row">
        <button class="pill" aria-pressed="true" data-trim="neck">Neckline</button>
        <button class="pill" aria-pressed="true" data-trim="cuffs">Sleeve Cuffs</button>
        <button class="pill" aria-pressed="true" data-trim="hem">Hem Border</button>
        <button class="pill" aria-pressed="false" data-trim="slits">Chaak Slits</button>
      </div>
    </div>

    <div>
      <p class="eyebrow">03 · Test</p>
      <div class="pill-row">
        <button class="pill" aria-pressed="false" data-test="checker">Grain checker</button>
        <button class="pill" aria-pressed="false" data-test="photo">Show photo only</button>
      </div>
      <p class="stat" id="stat"></p>
    </div>
  </div>
</div>

<script>
(() => {
  // one journey step = one fixed view = one plate (render.md §4)
  const VIEWS = {
    torso:  { plate: "assets/plates/torso-straight/",  name: "full torso" },
    neck:   { plate: "assets/plates/neck-straight/",   name: "neckline" },
    sleeve: { plate: "assets/plates/sleeve-straight/", name: "shoulder and sleeve" },
    hem:    { plate: "assets/plates/hem-straight/",    name: "hem and slit" },
  };
  // repeatCm = real width of one tile (assumptions until the atelier measures them)
  const FABRICS = {
    sage:    { src: "assets/swatches/fabric-sage-1024.jpg",    repeatCm: 30, name: "Sage Embroidered Organza", sheen: 0, sheenWidth: 1, antiTile: false },
    mocha:   { src: "assets/swatches/fabric-mocha-1024.jpg",   repeatCm: 30, name: "Mocha Chikan", sheen: 0, sheenWidth: 1, antiTile: true },
    mustard: { src: "assets/swatches/fabric-mustard-1024.jpg", repeatCm: 20, name: "Mustard Crinkled Gauze", sheen: 0, sheenWidth: 1, antiTile: true },
  };
  // laces: horizontal band, decorative edge at the bottom (tools/prep_lace.py)
  const LACES = {
    pearl:     { src: "assets/swatches/lace-pearl-2048.webp", meta: "assets/swatches/lace-pearl.json", mat: "assets/swatches/lace-pearl-mat.webp",     name: "Pearl Guipure Lace" },
    geometric: { src: "assets/swatches/lace-geometric-2048.webp", meta: "assets/swatches/lace-geometric.json", mat: "assets/swatches/lace-geometric-mat.webp", name: "Woven Diamond Border" },
    leaf:      { src: "assets/swatches/lace-leaf-2048.webp", meta: "assets/swatches/lace-leaf.json", mat: "assets/swatches/lace-leaf-mat.webp",      name: "Resham Bel Lace" },
    fine:      { src: "assets/swatches/lace-fine-2048.webp", meta: "assets/swatches/lace-fine.json", mat: "assets/swatches/lace-fine-mat.webp",      name: "Kiran Zari Edge" },
  };
  // trim id in id.png (G channel) → button group; flip = pearls on the other side of the strip
  const TRIMS = { neck: 1, "cuff-l": 2, "cuff-r": 3, hem: 4, "slit-l": 5, "slit-r": 6 };
  const FLIP = { "slit-r": 1 };
  const VIEW_FLIP = {};                                // per-view override of FLIP (set after checking the pearls)
  const GROUP = { neck: ["neck"], cuffs: ["cuff-l", "cuff-r"], hem: ["hem"], slits: ["slit-l", "slit-r"] };

  const params0 = new URLSearchParams(location.search);    // test switches: ?view=neck|sleeve|hem  ?fabric=mocha  ?lace=leaf
  const state = { view: VIEWS[params0.get("view")] ? params0.get("view") : "torso",
                  fabric: FABRICS[params0.get("fabric")] || params0.get("fabric") === "off" ? params0.get("fabric") : "sage",
                  lace: LACES[params0.get("lace")] ? params0.get("lace") : "pearl", trims: { neck: true, cuffs: true, hem: true, slits: false }, checker: false, photo: false };
  const stageImg = document.querySelector(".stage-frame img");

  const canvas = document.getElementById("stage");
  const note = document.getElementById("note");
  const stat = document.getElementById("stat");
  const fail = (msg) => { note.textContent = msg; note.classList.add("show"); };

  const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true }); // we draw rarely: keep the last frame
  if (!gl) { fail("WebGL2 is not available. The photo is shown without changes."); return; }
  if (location.protocol === "file:") {
    fail("Open this page through a local server: run  python3 -m http.server  in the myshoppe/demo folder, then open http://localhost:8000/testing.html");
    return;
  }

  // ---------- shaders
  const VS = `#version 300 es
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);   // one big triangle
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FS = `#version 300 es
  precision highp float;
  precision highp int;
  uniform sampler2D uPhoto, uId, uUV, uUVT, uShade, uFabric, uLace, uLaceMat;
  uniform vec2  uCanvas;        // canvas size in device px
  uniform vec2  uPlate;         // plate size (1200, 1600)
  uniform float uCmPerPx;       // plate px → cm
  uniform float uRange;         // UV range in cm (128)
  uniform float uFabricOn, uFabricCm;
  uniform float uLaceAspect;
  uniform float uTrimOn[7], uTrimWcm[7], uTrimFlip[7];
  uniform float uTrimFit[7], uTrimU0[7];
  uniform float uTrimVMax[7], uTrimEdging[7];   // stored V range of each strip (1.5 = edging strip); 1 = lace hangs past the edge
  uniform float uDisplaceMm;    // fabric shifted along the shade gradient in folds, mm at a strong fold slope (0 = off), step 7
  uniform float uSheen, uSheenWidth, uSheenOld;   // directional sheen of the fabric; uSheenOld = the old fixed 0.15 highlight (?sheen=0)
  uniform float uAntiTile;      // 1 = hex tiling of the fabric (irregular fabrics only), step 7
  uniform float uRelief;        // lace relief, metal and pearl (polish.md step 6); 0 = off (?relief=0)
  uniform float uHasMat;        // 1 = the lace has a material map on unit 7
  uniform float uLaceEdge;      // edgeDepth of the lace: share of its height that hangs past the garment edge
  uniform float uChecker, uPhotoOnly;
  uniform float uMipBias;       // log2 bias on the texture footprint (negative = sharper)
  uniform float uAniso;         // 1 = use plate UV gradients, 0 = round footprint
  uniform float uShadeOn;       // test: 0 = flat light (no folds), to measure the fold contrast of the render
  uniform float uShadowStrength; // darkening of the fabric under the lace (0 = off), polish.md step 1
  uniform vec2  uShadowMm;       // shadow offset on the stage in mm: right, down (key light at the upper left)
  uniform float uLinear;        // 1 = light maths in linear light (polish.md step 2), 0 = the old sRGB maths (?linear=0)
  uniform float uSrgbTex;       // 1 = colour textures are SRGB8_ALPHA8 (the GPU decodes), 0 = decode here (fallback)
  uniform float uShadeSqrt;     // plate.json shadeEncoding == "sqrt": shade = 2 * stored^2, linear light
  uniform float uShadeMed;      // plate.json shadeMedian / 255 (to convert between the two shade spaces)
  out vec4 outColor;
  const float HL_LIN = 0.05;

  // sRGB <-> linear (exact sRGB curve)
  vec3 toLin(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
  vec3 toSRGB(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  float toLin1(float c) { return toLin(vec3(c)).r; }
  float toSRGB1(float c) { return toSRGB(vec3(c)).r; }
  // a colour texture sample in the working space of the shader
  vec4 cin(vec4 t) { return (uLinear > 0.5 && uSrgbTex < 0.5) ? vec4(toLin(t.rgb), t.a) : t; }
  // stored shade -> shade in the working space (linear ratio, or the old sRGB ratio)
  float shadeOf(float stored) {
    if (uShadeSqrt > 0.5) {
      float sl = 2.0 * stored * stored;                                   // linear ratio
      return uLinear > 0.5 ? sl : toSRGB1(min(sl * toLin1(uShadeMed), 1.0)) / uShadeMed;
    }
    float so = stored * 2.0;                                               // old file: sRGB ratio
    return uLinear > 0.5 ? toLin1(min(so * uShadeMed, 1.0)) / toLin1(uShadeMed) : so;
  }

  vec2 decode(vec4 t) {                       // 12-bit packed → cm
    vec3 c = floor(t.rgb * 255.0 + 0.5);
    float u = c.r * 16.0 + floor(c.b / 16.0);
    float v = c.g * 16.0 + mod(c.b, 16.0);
    return vec2(u, v) / 4095.0 * uRange;
  }

  // UV step per canvas px, from the plate itself (central difference over +-R plate px).
  // Used only when both neighbours are in the same zone / trim: no derivatives across zone edges.
  const int R = 4;
  void gradFabric(ivec2 p, int zone, float k, out vec2 gx, out vec2 gy) {
    ivec2 mx = ivec2(uPlate) - 1;
    ivec2 a = clamp(p + ivec2(R, 0), ivec2(0), mx), b = clamp(p - ivec2(R, 0), ivec2(0), mx);
    ivec2 c = clamp(p + ivec2(0, R), ivec2(0), mx), d = clamp(p - ivec2(0, R), ivec2(0), mx);
    float iso = uCmPerPx * k / uFabricCm;                              // round footprint (cm per canvas px)
    gx = vec2(iso, 0.0); gy = vec2(0.0, iso);
    if (uAniso < 0.5) return;
    bool okx = int(texelFetch(uId, a, 0).r * 255.0 + 0.5) == zone && int(texelFetch(uId, b, 0).r * 255.0 + 0.5) == zone
            && texelFetch(uId, a, 0).g == 0.0 && texelFetch(uId, b, 0).g == 0.0;
    bool oky = int(texelFetch(uId, c, 0).r * 255.0 + 0.5) == zone && int(texelFetch(uId, d, 0).r * 255.0 + 0.5) == zone
            && texelFetch(uId, c, 0).g == 0.0 && texelFetch(uId, d, 0).g == 0.0;
    if (okx && oky) {
      gx = (decode(texelFetch(uUV, a, 0)) - decode(texelFetch(uUV, b, 0))) / float(a.x - b.x) * k / uFabricCm;
      gy = (decode(texelFetch(uUV, c, 0)) - decode(texelFetch(uUV, d, 0))) / float(c.y - d.y) * k / uFabricCm;
    }
  }
  void gradTrim(ivec2 p, int trim, float k, float w, float fit, out vec2 gx, out vec2 gy) {
    ivec2 mx = ivec2(uPlate) - 1;
    ivec2 a = clamp(p + ivec2(R, 0), ivec2(0), mx), b = clamp(p - ivec2(R, 0), ivec2(0), mx);
    ivec2 c = clamp(p + ivec2(0, R), ivec2(0), mx), d = clamp(p - ivec2(0, R), ivec2(0), mx);
    float iso = uCmPerPx * k / w;                                       // lace height is 1 in texture T
    gx = vec2(iso / (uLaceAspect * fit), 0.0); gy = vec2(0.0, iso);
    if (uAniso < 0.5) return;
    bool ok = int(texelFetch(uId, a, 0).g * 255.0 + 0.5) == trim && int(texelFetch(uId, b, 0).g * 255.0 + 0.5) == trim
           && int(texelFetch(uId, c, 0).g * 255.0 + 0.5) == trim && int(texelFetch(uId, d, 0).g * 255.0 + 0.5) == trim;
    if (!ok) return;
    vec2 sx = (decode(texelFetch(uUVT, a, 0)) - decode(texelFetch(uUVT, b, 0))) / float(a.x - b.x) * k;
    vec2 sy = (decode(texelFetch(uUVT, c, 0)) - decode(texelFetch(uUVT, d, 0))) / float(c.y - d.y) * k;
    gx = vec2(sx.x / (w * uLaceAspect * fit), sx.y / uRange);           // across (V) is 0..1 over the strip
    gy = vec2(sy.x / (w * uLaceAspect * fit), sy.y / uRange);
  }

  // ---- step 7: hex tiling (offsets only, no rotation: the grain direction stays), contrast-preserving blend
  vec2 hash2(vec2 q) { return fract(sin(vec2(dot(q, vec2(127.1, 311.7)), dot(q, vec2(269.5, 183.3)))) * 43758.5453); }
  vec3 fabricAt(vec2 t, vec2 gx, vec2 gy) {                         // t: uv / repeat (tile units)
    if (uAntiTile < 0.5) return cin(textureGrad(uFabric, t, gx, gy)).rgb;
    // 1 hex cell per tile (2 per tile cut more vines at the cell borders in the offline test), skewed triangle grid
    vec2 sk = mat2(1.0, 0.0, -0.57735027, 1.15470054) * (t * 3.4641016);
    vec2 base = floor(sk);
    vec3 f = vec3(fract(sk), 0.0);
    f.z = 1.0 - f.x - f.y;
    float sgn = step(0.0, -f.z), s2 = 2.0 * sgn - 1.0;
    vec3 w = vec3(-f.z * s2, sgn - f.y * s2, sgn - f.x * s2);       // barycentric, sums to 1
    vec2 v1 = base + vec2(sgn), v2 = base + vec2(sgn, 1.0 - sgn), v3 = base + vec2(1.0 - sgn, sgn);
    vec3 c1 = cin(textureGrad(uFabric, t + hash2(v1), gx, gy)).rgb;
    vec3 c2 = cin(textureGrad(uFabric, t + hash2(v2), gx, gy)).rgb;
    vec3 c3 = cin(textureGrad(uFabric, t + hash2(v3), gx, gy)).rgb;
    vec3 mean = cin(textureLod(uFabric, vec2(0.5), 20.0)).rgb;       // top mip = the mean colour of the swatch
    w = pow(w, vec3(7.0));
    w /= (w.x + w.y + w.z);                                          // narrow blend zones
    vec3 c = w.x * c1 + w.y * c2 + w.z * c3;
    return clamp(mean + (c - mean) / sqrt(dot(w, w)), 0.0, 1.0);     // keep the contrast of the motifs in the blend zones
  }

  void main() {
    vec2 frag = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);   // top-left origin
    vec2 st = frag / uCanvas;
    vec4 photo = cin(texture(uPhoto, st));
    if (uPhotoOnly > 0.5) { outColor = vec4(uLinear > 0.5 ? toSRGB(photo.rgb) : photo.rgb, 1.0); return; }

    float k = uPlate.x / uCanvas.x;                                  // plate px per canvas px
    ivec2 p = ivec2(min(floor(frag * k), uPlate - 1.0));
    vec4 idt = texelFetch(uId, p, 0);
    int zone = int(idt.r * 255.0 + 0.5);
    int trim = int(idt.g * 255.0 + 0.5);
    bool bg = zone == 0;                                             // wall, form, stand: only an edging overhang is drawn here
    if (bg && !(trim > 0 && uTrimOn[trim] > 0.5 && uTrimEdging[trim] > 0.5)) {
      outColor = vec4(uLinear > 0.5 ? toSRGB(photo.rgb) : photo.rgb, 1.0); return;
    }

    // Canvas bigger than the plate (k < 1): interpolate between the 4 nearest plate texels,
    // but only when they are all in the same zone (or trim). Otherwise: nearest texel, so
    // zone edges stay sharp and no UV is mixed across a jump.
    bool up = k < 0.999;
    ivec2 mx = ivec2(uPlate) - 1;
    vec2 fp = frag * k - 0.5;
    ivec2 q0 = ivec2(floor(fp));
    vec2 fr = fp - vec2(q0);
    ivec2 q00 = clamp(q0, ivec2(0), mx), q10 = clamp(q0 + ivec2(1, 0), ivec2(0), mx);
    ivec2 q01 = clamp(q0 + ivec2(0, 1), ivec2(0), mx), q11 = clamp(q0 + ivec2(1, 1), ivec2(0), mx);
    vec4 i00 = texelFetch(uId, q00, 0), i10 = texelFetch(uId, q10, 0);
    vec4 i01 = texelFetch(uId, q01, 0), i11 = texelFetch(uId, q11, 0);
    vec4 wq = vec4((1.0 - fr.x) * (1.0 - fr.y), fr.x * (1.0 - fr.y), (1.0 - fr.x) * fr.y, fr.x * fr.y);

    // soft edge
    float cov = 0.0;
    if (bg) cov = 1.0;                                               // overhang: the lace alpha does the edge
    else if (up) {
      cov = dot(wq, vec4(i00.r > 0.0 ? 1.0 : 0.0, i10.r > 0.0 ? 1.0 : 0.0, i01.r > 0.0 ? 1.0 : 0.0, i11.r > 0.0 ? 1.0 : 0.0));
    } else {                                                          // share of garment px in a 3x3 block
      for (int dy = -1; dy <= 1; dy++)
        for (int dx = -1; dx <= 1; dx++)
          cov += texelFetch(uId, clamp(p + ivec2(dx, dy), ivec2(0), mx), 0).r > 0.0 ? 1.0 : 0.0;
      cov /= 9.0;
    }

    float s = shadeOf(up ? texture(uShade, st).r : texelFetch(uShade, p, 0).r);   // 1.0 = normal light
    if (uShadeOn < 0.5) s = 1.0;
    vec2 uv = decode(texelFetch(uUV, p, 0));                          // cm
    if (up && i00.r == idt.r && i10.r == idt.r && i01.r == idt.r && i11.r == idt.r)
      uv = wq.x * decode(texelFetch(uUV, q00, 0)) + wq.y * decode(texelFetch(uUV, q10, 0))
         + wq.z * decode(texelFetch(uUV, q01, 0)) + wq.w * decode(texelFetch(uUV, q11, 0));

    // ---- step 7: displacement in folds. Shade gradient from same-zone neighbours only (no tear at a zone edge), per mm;
    // the fabric moves along it by uDisplaceMm at a strong fold slope (0.05 per mm), at most 1.5 mm.
    vec2 fgx = vec2(0.0), fgy = vec2(0.0);
    if (!bg) {
      gradFabric(p, zone, k, fgx, fgy);
      if (uDisplaceMm > 0.0) {
        ivec2 mxp = ivec2(uPlate) - 1;
        ivec2 pa = clamp(p + ivec2(R, 0), ivec2(0), mxp), pb = clamp(p - ivec2(R, 0), ivec2(0), mxp);
        ivec2 pc = clamp(p + ivec2(0, R), ivec2(0), mxp), pd = clamp(p - ivec2(0, R), ivec2(0), mxp);
        float zr = idt.r;
        if (texelFetch(uId, pa, 0).r == zr && texelFetch(uId, pb, 0).r == zr && texelFetch(uId, pc, 0).r == zr && texelFetch(uId, pd, 0).r == zr) {
          float mmpp = uCmPerPx * 10.0;                                  // mm per plate px
          vec2 g = vec2(shadeOf(texelFetch(uShade, pa, 0).r) - shadeOf(texelFetch(uShade, pb, 0).r),
                        shadeOf(texelFetch(uShade, pc, 0).r) - shadeOf(texelFetch(uShade, pd, 0).r)) / (2.0 * float(R) * mmpp);
          vec2 dmm = uDisplaceMm * g / 0.05;
          float L = length(dmm);
          if (L > 1.5) dmm *= 1.5 / L;
          vec2 dpx = dmm / mmpp / k;                                     // mm -> plate px -> canvas px
          uv += (fgx * dpx.x + fgy * dpx.y) * uFabricCm;                 // fgx, fgy: (uv / repeat) per canvas px
        }
      }
    }

    vec3 col = photo.rgb;
    if (bg) {
      // the photo stays: the lace and its shadow go on top
    } else if (uChecker > 0.5) {
      float c = mod(floor(uv.x / 2.0) + floor(uv.y / 2.0), 2.0);
      vec3 a = zone == 1 ? vec3(0.84, 0.28, 0.25) : zone == 4 ? vec3(0.15, 0.62, 0.38)
             : zone == 5 ? vec3(0.42, 0.24, 0.55) : vec3(0.17, 0.36, 0.75);    // 4 back, 5 side back
      vec3 ck = mix(a, vec3(0.96, 0.92, 0.86), c);
      col = (uLinear > 0.5 ? toLin(ck) : ck) * s;
    } else if (uFabricOn > 0.5) {
      // explicit gradients (from the plate, not from screen derivatives): no seams where UVs jump
      float bias = exp2(uMipBias);
      vec3 f = fabricAt(uv / uFabricCm, fgx * bias, fgy * bias);
      if (uSheenOld > 0.5) {
        // the old fixed highlight (?sheen=0). In linear light the shade above 1 is s_srgb^2.4, so its weight is smaller.
        col = f * s + max(s - 1.0, 0.0) * (uLinear > 0.5 ? HL_LIN : 0.15);
      } else {
        col = f * s;                                                     // matte: no extra highlight
        if (uSheen > 0.0) {
          // directional sheen: the shade above 1, averaged ALONG THE WARP (the direction in which V changes fastest on
          // the plate), so the highlight is stretched along the grain: down the front, along the arm on the sleeve
          vec2 wd = vec2(fgx.y, fgy.y);
          wd = length(wd) > 0.0 ? normalize(wd) : vec2(0.0, 1.0);
          float sa = s, n = 1.0;
          ivec2 mxp = ivec2(uPlate) - 1;
          for (int i = -2; i <= 2; i++) {
            if (i == 0) continue;
            ivec2 q = clamp(p + ivec2(round(wd * float(i) * 6.0)), ivec2(0), mxp);
            if (texelFetch(uId, q, 0).r == idt.r) { sa += shadeOf(texelFetch(uShade, q, 0).r); n += 1.0; }
          }
          sa /= n;
          col += f * uSheen * pow(max(sa - 1.0, 0.0), uSheenWidth) + vec3(0.25 * uSheen) * pow(max(sa - 1.0, 0.0), uSheenWidth + 1.0);
        }
      }
    }

    if (trim > 0 && uTrimOn[trim] > 0.5) {
      vec2 t = decode(texelFetch(uUVT, p, 0));
      if (up && i00.g == idt.g && i10.g == idt.g && i01.g == idt.g && i11.g == idt.g)
        t = wq.x * decode(texelFetch(uUVT, q00, 0)) + wq.y * decode(texelFetch(uUVT, q10, 0))
          + wq.z * decode(texelFetch(uUVT, q01, 0)) + wq.w * decode(texelFetch(uUVT, q11, 0));
      float rawV = t.y / uRange * uTrimVMax[trim];                      // 0 inner side .. 1 garment edge .. vMax tip of the overhang
      bool edg = uTrimEdging[trim] > 0.5;
      // the overhang of an edging strip is used only when edging is on for this trim and lace (else: no trim here, as before)
      if (edg || rawV <= 1.0) {
      float across = rawV;
      if (uTrimFlip[trim] > 0.5) across = 1.0 - across;                // old plates only (no outerV)
      if (edg) across -= uLaceEdge;                                     // the decorative edge crosses the garment edge
      bool inLace = across >= 0.0 && across <= 1.0;
      float w = uTrimWcm[trim];
      float fit = uTrimFit[trim];
      vec2 lc = vec2(t.x / (w * uLaceAspect * fit) + uTrimU0[trim], across);
      vec2 gx, gy;
      gradTrim(p, trim, k, w, fit, gx, gy);
      float bias = exp2(uMipBias);
      vec4 lace = cin(textureGrad(uLace, lc, gx * bias, gy * bias));
      if (!inLace) lace = vec4(0.0);
      if (uRelief > 0.5 && uHasMat > 0.5 && inLace) {
        // material map: R height, G metal, B pearl dome. Height gradient on the SCREEN (gx, gy = lace coords per canvas px),
        // so the light comes from the upper left on every trim, whatever its direction.
        vec3 m0 = textureGrad(uLaceMat, lc, gx * bias, gy * bias).rgb;
        vec3 mhx = textureGrad(uLaceMat, lc + gx * 1.5, gx * bias, gy * bias).rgb;
        vec3 mhy = textureGrad(uLaceMat, lc + gy * 1.5, gx * bias, gy * bias).rgb;
        // a surface that rises towards the lower right faces the key light: lighter; away from it: darker; +-15 % at most
        // gain 0.15: offline, on the tiles at stage scale, 0.25 already clamped 5-24 % of the lace px; 0.15 keeps it gentle
        float lit = clamp(1.0 + 0.15 * ((mhx.r - m0.r) + (mhy.r - m0.r)), 0.85, 1.15);
        // pearls: their bright centres were keyed out with the paper; the dome fills them, lit from the upper left
        float pd = m0.b;
        if (pd > 0.01) {
          float pg = (mhx.b - m0.b) + (mhy.b - m0.b);                      // > 0 on the upper-left half of the dome
          vec3 pc = vec3(0.93, 0.91, 0.87);
          if (uLinear > 0.5) pc = toLin(pc);
          float fill = smoothstep(0.0, 0.2, pd);
          lace.rgb = mix(lace.rgb, pc, fill * (1.0 - lace.a));
          lace.a = max(lace.a, fill);
          lit *= clamp(1.0 + 2.5 * pg, 0.8, 1.2);                        // lighter upper left, darker rim lower right
          lace.rgb += vec3(0.45) * pow(clamp(4.0 * pg, 0.0, 1.0), 3.0) * fill;   // small highlight
        }
        lace.rgb *= lit;
        // metal (zari): a highlight tinted with the thread colour, stronger where the photo was lit (shade > 1),
        // stretched along the thread (the height read 3x longer along the lace)
        if (m0.g > 0.02) {
          float hs = textureGrad(uLaceMat, lc, gx * bias * 3.0, gy * bias).r;
          float hl = smoothstep(0.02, 0.12, m0.r - hs + (lit - 1.0));
          lace.rgb += lace.rgb * m0.g * hl * (0.35 + 0.65 * clamp(s - 0.8, 0.0, 1.0));
        }
      }
      if (uShadowStrength > 0.0) {
        // Shadow of the lace on the fabric: the lace alpha read again, shifted right and down on the stage,
        // 1.5 mip levels softer. The shift is a fixed direction on the screen, so it stays lower-right along the
        // curve of the neckline: gx, gy are the lace coordinates per canvas px, from the plate UV.
        // on the background (wall, form) the lace is farther in front: a longer, softer shadow (x1.5, +0.5 mip)
        vec2 so = uShadowMm * (bg ? 1.5 : 1.0) / (uCmPerPx * 10.0) / k;  // mm -> plate px -> canvas px
        vec2 off = gx * so.x + gy * so.y;
        float soft = bg ? 4.0 : 2.8284;
        vec2 sc = lc - off;
        float sh = (sc.y >= 0.0 && sc.y <= 1.0) ? textureGrad(uLace, sc, gx * bias * soft, gy * bias * soft).a : 0.0;
        col *= 1.0 - uShadowStrength * sh * (1.0 - lace.a);           // the lace itself is not darkened
      }
      col = mix(col, lace.rgb * (uLinear > 0.5 ? min(s * 1.124, 1.399) : min(s * 1.05, 1.15)), lace.a);   // 1.05^2.4, 1.15^2.4
      }
    }

    vec3 res = mix(photo.rgb, clamp(col, 0.0, 1.0), cov);
    outColor = vec4(uLinear > 0.5 ? toSRGB(res) : res, 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());
  const U = (n) => gl.getUniformLocation(prog, n);

  // ---------- textures
  const aniso = gl.getExtension("EXT_texture_filter_anisotropic");
  const params = new URLSearchParams(location.search);       // test switches: ?bias=0  ?aniso=0  ?shade=0  ?shadow=0  ?linear=0  ?lacefit=0  ?edging=0  ?relief=0  ?displace=0  ?sheen=0|test  ?antitile=0
  const MIP_BIAS = params.has("bias") ? parseFloat(params.get("bias")) : -0.5;
  if (params.has("stage")) {                                  // test: ?stage=<css px> makes the stage wider
    const st = document.createElement("style");
    st.textContent = `.studio-shell{max-width:none;grid-template-columns:${parseInt(params.get("stage"))}px 360px}`;
    document.head.appendChild(st);
  }
  const USE_PLATE_GRAD = params.get("aniso") === "0" ? 0 : 1;
  const SHADE_ON = params.get("shade") === "0" ? 0 : 1;           // test: ?shade=0  flat light
  const LINEAR = params.get("linear") === "0" ? 0 : 1;            // test: ?linear=0  the old sRGB maths
  let SRGB_TEX = LINEAR;                                         // SRGB8_ALPHA8 colour textures (falls back to shader decode)
  const DISPLACE = params.get("displace") === "0" ? 0 : 1.0;      // test: ?displace=0  no displacement in folds
  const SHEEN = params.get("sheen");                              // test: ?sheen=0  old fixed highlight; ?sheen=test  a temporary sheen
  const ANTITILE = params.get("antitile") === "0" ? 0 : 1;        // test: ?antitile=0  plain repeat
  const RELIEF = params.get("relief") === "0" ? 0 : 1;            // test: ?relief=0  no lace relief, metal or pearl
  const EDGING = params.get("edging") === "0" ? 0 : 1;            // test: ?edging=0  edging trims clipped at the garment edge
  const LACEFIT = params.get("lacefit") === "0" ? 0 : 1;          // test: ?lacefit=0  the old mirrored lace, no fit, no start point
  const SHADOW = params.has("shadow") ? parseFloat(params.get("shadow")) : 0.35;   // test: ?shadow=0 off, ?shadow=0.5 stronger
  // data maps: exact bytes (no colour conversion, no premultiply), NEAREST
  // images: normal decode, LINEAR + mipmaps
  async function bitmap(url, data) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    const blob = await res.blob();
    return createImageBitmap(blob, data
      ? { colorSpaceConversion: "none", premultiplyAlpha: "none" }
      : { premultiplyAlpha: "none" });
  }
  function texture(unit, img, { data = false, linear = false, mips = false, wrap = gl.CLAMP_TO_EDGE } = {}) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, data ? gl.NONE : gl.BROWSER_DEFAULT_WEBGL);
    gl.texImage2D(gl.TEXTURE_2D, 0, (!data && SRGB_TEX) ? gl.SRGB8_ALPHA8 : gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap === gl.MIRRORED_REPEAT ? wrap : gl.CLAMP_TO_EDGE);
    if (data && mips) {                                 // smooth data with mipmaps (lace material map)
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } else if (data) {
      const f = linear ? gl.LINEAR : gl.NEAREST;                      // linear only for smooth data (shade)
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    } else {
      gl.generateMipmap(gl.TEXTURE_2D);
      if (SRGB_TEX && gl.getError() !== gl.NO_ERROR) {          // sRGB mipmaps not supported: decode in the shader instead
        SRGB_TEX = 0;
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.uniform1f(U("uSrgbTex"), 0);
      }
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    }
    return t;
  }

  let plate = null;
  const units = [];                                    // texture object on each unit (replaced on a view switch)
  const cache = {};                                    // view -> Promise of { plate, photo, id, uv, uvt, shade }

  function setUnit(unit, img, opts) {
    if (units[unit]) gl.deleteTexture(units[unit]);
    units[unit] = texture(unit, img, opts);
  }

  function fetchView(view) {                           // download once, keep the decoded images
    if (!cache[view]) {
      const P = VIEWS[view].plate;
      cache[view] = Promise.all([
        fetch(P + "plate.json").then((r) => { if (!r.ok) throw new Error(`${P}plate.json: ${r.status}`); return r.json(); }),
        bitmap(P + "base.jpg", false),
        bitmap(P + "id.png", true),
        bitmap(P + "uv.png", true),
        bitmap(P + "uv_trim.png", true),
        bitmap(P + "shade.png", true),
      ]).then(([plate, photo, id, uv, uvt, shade]) => ({ plate, photo, id, uv, uvt, shade }));
      cache[view].catch(() => delete cache[view]);    // allow a retry
    }
    return cache[view];
  }

  const swatchCache = {};                              // url -> Promise of ImageBitmap
  const swatch = (src) => (swatchCache[src] ||= bitmap(src, false));

  async function setFabric(key) {                      // fabric on unit 5 (no-op for "off")
    if (key === "off") return;
    const f = FABRICS[key], img = await swatch(f.src);
    if (state.fabric !== key) return;                  // a later click won
    setUnit(5, img, { wrap: gl.REPEAT });              // swatch is made seamless offline
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.uniform1f(U("uFabricCm"), f.repeatCm);
    gl.uniform1f(U("uSheenOld"), SHEEN === "0" ? 1 : 0);
    gl.uniform1f(U("uSheen"), SHEEN === "test" ? 0.6 : f.sheen || 0);
    gl.uniform1f(U("uSheenWidth"), f.sheenWidth || 1);
    gl.uniform1f(U("uAntiTile"), ANTITILE && f.antiTile ? 1 : 0);
  }
  const matCache = {};                                 // url -> Promise of the lace material map
  const metaCache = {};                                // url -> Promise of the lace sidecar (tools/prep_lace.py --repeat)
  const laceMetaOf = (url) => (metaCache[url] ||= fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null));
  let lace = null;                                     // { meta, aspect } of the lace on unit 6

  async function setLace(key) {                        // lace on unit 6
    const [img, meta, mat] = await Promise.all([swatch(LACES[key].src), laceMetaOf(LACES[key].meta),
      LACES[key].mat ? (matCache[LACES[key].mat] ||= bitmap(LACES[key].mat, true).catch(() => null)) : null]);
    if (state.lace !== key) return;
    // a lace with a measured repeat tiles with REPEAT; a lace without one (or ?lacefit=0) keeps the mirror
    const mirror = !LACEFIT || !meta || meta.mirror;
    setUnit(6, img, { wrap: mirror ? gl.MIRRORED_REPEAT : gl.REPEAT });   // along the trim (S); across (T) is clamped
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (mat) {                                         // material map on unit 7: same coordinates and wrap as the lace
      setUnit(7, mat, { data: true, mips: true, wrap: mirror ? gl.MIRRORED_REPEAT : gl.REPEAT });
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }
    gl.uniform1f(U("uHasMat"), mat && RELIEF ? 1 : 0);
    lace = { meta: mirror ? null : meta, aspect: img.width / img.height, mirror };
    gl.uniform1f(U("uLaceAspect"), lace.aspect);
    laceFit();
  }

  // Whole repeats on each trim, and a defined start (polish.md step 4). s = u / (tile length * fit) + u0, in lace images.
  // The tile starts at a gap between motifs, so motif boundaries are at multiples of p = 1 / periods, centres in between.
  const CENTRED = { neck: 1, hem: 1 };                 // a motif centred at the middle of the trim (centre front, middle of the hem)
  const END = { "slit-l": 1, "slit-r": 1 };            // a whole motif at the END of the trim (the hem end of a slit); others: at the start
  const fitLog = {};
  function laceFit() {
    if (!plate || !lace) return;
    const fit = new Float32Array(7).fill(1), u0 = new Float32Array(7);
    const vmax = new Float32Array(7).fill(1), edging = new Float32Array(7);
    const edgeDepth = lace.meta?.edgeDepth ?? 0.35;
    for (const [name, id] of Object.entries(TRIMS)) {
      const t = plate.trims[name];
      if (!t) continue;
      const L = t.lengthCm, w = t.widthMm / 10, tile = w * lace.aspect;   // cm
      vmax[id] = t.vMax || 1;
      edging[id] = EDGING && t.type === "edging" && lace.meta?.edging ? 1 : 0;   // only laces with a clean (keyed) edge
      if (!LACEFIT) { fitLog[name] = "off"; continue; }
      if (lace.mirror) {                               // no repeat: a mirror axis at the middle of neck and hem
        if (CENTRED[name]) u0[id] = -L / (2 * tile);
        fitLog[name] = "mirror";
        continue;
      }
      const m = lace.meta, p = 1 / m.periods, r = m.periodRatio * w;     // repeat length in cm at this trim width
      const lim = L < 3 * r ? 0.10 : 0.05;              // plan fallback: +-10 % on trims shorter than 3 repeats
      let n = Math.max(1, Math.round(L / r));
      if (CENTRED[name]) {                             // odd n: a centred motif AND whole motifs at both ends
        const odd = Math.max(1, 2 * Math.round((L / r - 1) / 2) + 1);
        if (Math.abs(L / (odd * r) - 1) <= lim) n = odd;
      }
      let f = L / (n * r);
      if (Math.abs(f - 1) > lim) f = 1;                 // keep the scale; recorded in fitLog
      fit[id] = f;
      const S = (u) => u / (tile * f);                 // trim cm -> lace images
      if (CENTRED[name]) u0[id] = 0.5 * p - S(L / 2);
      else if (END[name]) u0[id] = -S(L);
      else u0[id] = 0;
      fitLog[name] = { n, fit: +f.toFixed(4), repeatCm: +r.toFixed(3) };
    }
    gl.uniform1fv(U("uTrimFit"), fit);
    gl.uniform1fv(U("uTrimU0"), u0);
    gl.uniform1fv(U("uTrimVMax"), vmax);
    gl.uniform1fv(U("uTrimEdging"), edging);
    gl.uniform1f(U("uLaceEdge"), edgeDepth);
    document.documentElement.dataset.lacefit = JSON.stringify(fitLog);   // for the harness (--dump-dom)
  }

  async function loadShared() {                        // samplers and swatches: once for all views
    ["uPhoto", "uId", "uUV", "uUVT", "uShade", "uFabric", "uLace", "uLaceMat"].forEach((n, i) => gl.uniform1i(U(n), i));
    gl.uniform1f(U("uMipBias"), MIP_BIAS);
    gl.uniform1f(U("uAniso"), USE_PLATE_GRAD);
    gl.uniform1f(U("uShadeOn"), SHADE_ON);
    gl.uniform1f(U("uShadowStrength"), SHADOW);
    gl.uniform1f(U("uRelief"), RELIEF);
    gl.uniform1f(U("uDisplaceMm"), DISPLACE);
    gl.uniform1f(U("uLinear"), LINEAR);
    gl.uniform1f(U("uSrgbTex"), SRGB_TEX);
    gl.uniform2f(U("uShadowMm"), 0.6, 0.9);
    await Promise.all([setFabric(state.fabric), setLace(state.lace)]);
    gl.uniform1fv(U("uTrimFit"), new Float32Array(7).fill(1));
  }

  let switchToken = 0;
  async function showView(view) {
    const token = ++switchToken;
    const t0 = performance.now();
    const v = await fetchView(view);
    if (token !== switchToken) return;                 // a later click won
    setUnit(0, v.photo);
    setUnit(1, v.id, { data: true });
    setUnit(2, v.uv, { data: true });
    setUnit(3, v.uvt, { data: true });
    setUnit(4, v.shade, { data: true, linear: true }); // texelFetch ignores the filter: one texture for exact and smooth reads
    plate = v.plate;
    note.classList.remove("show");
    gl.uniform2f(U("uPlate"), plate.viewBox[0], plate.viewBox[1]);
    gl.uniform1f(U("uCmPerPx"), plate.mmPerPx / 10);
    gl.uniform1f(U("uRange"), plate.uvRangeCm);
    gl.uniform1f(U("uShadeSqrt"), plate.shadeEncoding === "sqrt" ? 1 : 0);
    gl.uniform1f(U("uShadeMed"), (plate.shadeMedian || 213) / 255);
    const w = new Float32Array(7), flip = new Float32Array(7);
    const viewFlip = VIEW_FLIP[view] || FLIP;
    for (const [name, id] of Object.entries(TRIMS)) {
      w[id] = (plate.trims[name]?.widthMm ?? 20) / 10;
      // new plates orient V themselves (outerV = 1: 0 inner side, 1 garment edge); old plates use the FLIP table
      flip[id] = plate.trims[name]?.outerV !== undefined ? 0 : (viewFlip[name] || 0);
    }
    gl.uniform1fv(U("uTrimWcm"), w);
    gl.uniform1fv(U("uTrimFlip"), flip);
    laceFit();
    // trim pills: only the trims this view shows
    document.querySelectorAll("[data-trim]").forEach((b) => {
      b.hidden = !GROUP[b.dataset.trim].some((n) => plate.trims[n]);
    });
    stageImg.src = VIEWS[view].plate + "base.jpg";    // fallback photo under the canvas
    stat.dataset.load = Math.round(performance.now() - t0);
    canvas.width = 0;                                  // force resize() to set the canvas for this plate
    resize();
    canvas.classList.add("ready");
  }

  async function load() {
    await loadShared();
    await showView(state.view);
    // preload the other views in idle time
    const idle = window.requestIdleCallback || ((f) => setTimeout(f, 300));
    idle(() => {
      Object.keys(VIEWS).forEach((k) => fetchView(k).catch(() => {}));
      [...Object.values(FABRICS), ...Object.values(LACES)].forEach((x) => swatch(x.src).catch(() => {}));
    });
  }

  // ---------- draw (only on change)
  function render() {
    const on = new Float32Array(7);
    for (const [group, names] of Object.entries(GROUP))
      for (const n of names) on[TRIMS[n]] = state.trims[group] ? 1 : 0;
    gl.uniform1fv(U("uTrimOn"), on);
    gl.uniform1f(U("uFabricOn"), state.fabric === "off" ? 0 : 1);
    gl.uniform1f(U("uChecker"), state.checker ? 1 : 0);
    gl.uniform1f(U("uPhotoOnly"), state.photo ? 1 : 0);
    const t0 = performance.now();
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    stat.textContent = `Load ${stat.dataset.load} ms · draw ${(performance.now() - t0).toFixed(1)} ms · ${canvas.width}×${canvas.height}`;
    canvas.setAttribute("aria-label", describe());
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(plate.viewBox[0] * 2, Math.round(r.width * dpr));   // up to 2x the plate
    const h = Math.round(w * plate.viewBox[1] / plate.viewBox[0]);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(U("uCanvas"), w, h);
    }
    render();
  }

  function describe() {
    const parts = [state.fabric === "off" ? "Plain white straight kurta" : `Straight kurta in ${FABRICS[state.fabric].name.toLowerCase()}`];
    const on = Object.entries(state.trims).filter(([, v]) => v).map(([k]) => ({ neck: "neckline", cuffs: "cuffs", hem: "hem", slits: "slits" })[k]);
    if (on.length) parts.push(`${LACES[state.lace].name.toLowerCase()} on the ${on.join(", ")}`);
    return `View: ${VIEWS[state.view].name}. ` + parts.join(", with ") + ".";
  }

  document.querySelector('[data-group="view"]').addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (!b || b.dataset.view === state.view) return;
    state.view = b.dataset.view;
    b.parentElement.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    showView(state.view).catch((err) => { console.error(err); fail("The view did not load: " + err.message); });
  });
  document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.view === state.view)));
  document.querySelectorAll("[data-fabric]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.fabric === state.fabric)));
  document.querySelectorAll("[data-lace]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lace === state.lace)));
  document.getElementById("caption-fabric").textContent = state.fabric === "off" ? "Plain White Toile" : FABRICS[state.fabric].name;
  document.getElementById("caption-trim").textContent = LACES[state.lace].name;

  // ---------- controls
  document.querySelector('[data-group="fabric"]').addEventListener("click", (e) => {
    const b = e.target.closest("[data-fabric]");
    if (!b) return;
    state.fabric = b.dataset.fabric;
    b.parentElement.querySelectorAll("[data-fabric]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("caption-fabric").textContent = state.fabric === "off" ? "Plain White Toile" : FABRICS[state.fabric].name;
    setFabric(state.fabric).then(() => plate && render()).catch((err) => fail("The fabric did not load: " + err.message));
  });
  document.querySelector('[data-group="lace"]').addEventListener("click", (e) => {
    const b = e.target.closest("[data-lace]");
    if (!b || b.dataset.lace === state.lace) return;
    state.lace = b.dataset.lace;
    b.parentElement.querySelectorAll("[data-lace]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const any = Object.values(state.trims).some(Boolean);
    document.getElementById("caption-trim").textContent = any ? LACES[state.lace].name : "No Lace";
    setLace(state.lace).then(() => plate && render()).catch((err) => fail("The lace did not load: " + err.message));
  });
  document.querySelectorAll("[data-trim]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.trim;
    state.trims[k] = !state.trims[k];
    b.setAttribute("aria-pressed", String(state.trims[k]));
    const any = Object.values(state.trims).some(Boolean);
    document.getElementById("caption-trim").textContent = any ? LACES[state.lace].name : "No Lace";
    if (plate) render();
  }));
  document.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.test;
    state[k] = !state[k];
    b.setAttribute("aria-pressed", String(state[k]));
    if (plate) render();
  }));

  let raf = 0;
  new ResizeObserver(() => { if (plate) { cancelAnimationFrame(raf); raf = requestAnimationFrame(resize); } }).observe(canvas);

  load().catch((err) => { console.error(err); fail("The plate did not load: " + err.message); });
})();
</script>
</body>
</html>

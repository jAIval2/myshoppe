worker_processes auto;
events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=shop_client:10m rate=10r/m;
    limit_req_zone $server_name zone=shop_global:1m rate=20r/s;
    limit_req_status 429;
    client_max_body_size 82m;

    upstream api_upstream { server api:8000; }
    upstream web_upstream { server web:3000; }

    server {
        listen 80;
        server_name _;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /api/checkout/quote {
            limit_req zone=shop_client burst=5 nodelay;
            limit_req zone=shop_global burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://api_upstream;
        }
        location = /api/checkout/attempts {
            limit_req zone=shop_client burst=5 nodelay;
            limit_req zone=shop_global burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://api_upstream;
        }
        location /api/auth/ {
            limit_req zone=shop_client burst=5 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://api_upstream;
        }
        location = /api/webhooks/razorpay {
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://api_upstream;
        }
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://api_upstream;
        }
        location /uploads/ {
            proxy_set_header Host $host;
            proxy_pass http://api_upstream;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://web_upstream;
        }
    }
}

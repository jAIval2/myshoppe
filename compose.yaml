services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: myshoppe
      POSTGRES_PASSWORD: myshoppe
      POSTGRES_DB: myshoppe
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myshoppe"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:

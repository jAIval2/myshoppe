<!doctype html>
<!--
  MyShoppe demo: one page for Cloudflare Pages (storefront and Bespoke Studio; no admin).
  Built from web/src/app/globals.css, web/src/features/bespoke/studio.css and a
  browser-only port of the web app. Deploy this whole folder (index.html,
  campaign.mp4, media/bespoke/). There is deliberately no 404.html, so Pages
  serves this file for every route and deep links work.
-->
<html lang="en-IN" data-scroll-behavior="smooth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyShoppe — Considered clothing. Thoughtful living.</title>
<meta name="description" content="Discover a considered collection of women’s clothing and home textiles. A quieter perspective on everyday style.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2247%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2252%22%20fill%3D%22%23171715%22%3Em%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Inter:wght@400..900&display=swap">
<style>
:root {
  --font-inter: "Inter";
  --font-bodoni: "Bodoni Moda";
}
:root {
  --paper: #fff;
  --canvas: #f6f5f2;
  --ink: #171715;
  --muted: #62625c;
  --line: #d9d8d2;
  --sale: #b52c7a;
  --error: #a12622;
  --focus: #2459a6;
  --serif: var(--font-bodoni), "Times New Roman", serif;
  --ui: var(--font-inter), Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --edge: 32px;
  --left: 17vw;
  --right: 12vw;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 14px/1.55 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  background: none;
  border: 0;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}
img,
video {
  display: block;
  width: 100%;
  object-fit: cover;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1,
h2,
h3 {
  font-weight: 400;
}
h1 {
  font-size: 24px;
  line-height: 1.3;
}
h2 {
  font-size: 14px;
}
hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 28px 0;
}
small {
  font-size: 11px;
}
input,
textarea,
select {
  border-radius: 0;
  background: #fff;
}
input:focus,
textarea:focus,
select:focus {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
}
::selection {
  background: #dfd9ce;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  top: -80px;
  left: 20px;
  z-index: 200;
  background: white;
  padding: 14px;
}
.skip-link:focus {
  top: 12px;
}
.micro,
.eyebrow {
  font-size: 12px;
  line-height: 1.5;
}
.eyebrow {
  letter-spacing: 0.13em;
}
.muted {
  color: var(--muted);
}
.sale {
  color: var(--sale);
}
.error {
  color: var(--error);
  font-size: 14px;
  white-space: pre-line;
}
.field-invalid {
  border-color: var(--error) !important;
  outline-color: var(--error);
  box-shadow: 0 0 0 1px var(--error);
}
.product-editor-fields {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}
.field-error {
  display: block;
  color: var(--error);
  font-size: 12px;
  line-height: 1.45;
  margin-top: 5px;
}
.field-error-summary {
  margin: 18px 0;
  padding: 16px 20px;
  border: 1px solid var(--error);
  background: #fffafa;
}
.field-error-summary:focus {
  outline: 2px solid var(--error);
  outline-offset: 3px;
}
.field-error-summary h2 {
  margin: 0 0 6px;
  font-size: 15px;
}
.field-error-summary p,
.field-error-summary ul {
  margin: 6px 0 0;
}
.field-error-summary ul {
  padding-left: 20px;
}
.field-error-summary button {
  color: var(--error);
  text-align: left;
  text-decoration: underline;
}
.button {
  border: 1px solid #777770;
  min-height: 46px;
  padding: 13px 25px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 12px;
  line-height: 18px;
  letter-spacing: 0.04em;
  background: white;
  transition:
    background 140ms,
    color 140ms;
}
.button:hover {
  background: #f1f0ec;
  text-decoration: none;
}
.button.primary {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
.button.primary:hover {
  background: #35352f;
}
.button.borderless {
  border-color: transparent;
}
.icon-button {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.text-link {
  padding: 12px 0;
  text-decoration: underline;
  text-underline-offset: 4px;
  font-size: 12px;
  min-height: 44px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin: 0 0 22px;
  font-size: 13px;
}
.field input,
.field textarea,
.field select {
  border: 0;
  border-bottom: 1px solid #94948d;
  padding: 10px 0;
  min-height: 44px;
  width: 100%;
  font-size: 16px;
}
.field textarea {
  min-height: 90px;
  resize: vertical;
}
.check-field {
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: 48px;
  margin: 12px 0;
}
.check-field input {
  accent-color: black;
  width: 18px;
  height: 18px;
}
.empty-state {
  min-height: 40vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 20px;
}
.empty-state h1,
.empty-state h2 {
  font-family: var(--serif);
  font-size: 38px;
}
.empty-state .button {
  margin-top: 20px;
}
.error-page {
  margin-top: 15vh;
}
.loading {
  min-height: 25vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-size: 12px;
}
.loading-line {
  height: 1px;
  width: 70px;
  background: #222;
  animation: pulse 1s ease-in-out infinite;
}
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: #171715;
  color: white;
  padding: 16px 36px;
  font-size: 12px;
}
.connection-message {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 12px;
  background: white;
  border: 1px solid var(--error);
  z-index: 100;
  max-width: 330px;
}
/* Reference corner controls: functional layer is separate from campaign wordmark. */
.corner-controls {
  position: fixed;
  inset: 0 0 auto;
  z-index: 30;
  height: 110px;
  pointer-events: none;
}
.corner-controls > * {
  pointer-events: auto;
}
.menu-trigger {
  position: absolute;
  top: 32px;
  left: 32px;
  width: 76px;
  height: 48px;
  padding: 8px 0;
}
.menu-trigger span {
  display: block;
  width: 72px;
  height: 1px;
  background: currentColor;
  margin: 15px 0;
}
.search-trigger {
  position: absolute;
  right: 32px;
  top: 38px;
  width: 150px;
  height: 36px;
  text-align: right;
  border-bottom: 1px solid currentColor;
  font-size: 12px;
  padding-top: 5px;
}
.compact-wordmark,
.mobile-bag {
  display: none;
}
.utility-rail {
  position: fixed;
  right: var(--edge);
  top: 23vh;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0;
  font-size: 12px;
  letter-spacing: 0.035em;
}
.utility-rail a {
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.utility-rail .active {
  font-weight: 600;
}
.bag-number {
  display: inline-block;
  border: 1px solid;
  border-top: 0;
  min-width: 18px;
  text-align: center;
  line-height: 16px;
}
.dialog {
  padding: 0;
  border: 0;
  max-width: 100vw;
  max-height: 100dvh;
  color: var(--ink);
  background: #fff;
}
.dialog::backdrop {
  background: rgb(0 0 0/0.28);
}
.dialog[open] {
  animation: dialog-in 220ms var(--ease);
}
.dialog-content {
  padding: 64px 36px 40px;
}
.dialog-close {
  position: absolute;
  right: 18px;
  top: 14px;
  z-index: 5;
}
.quick-add-dialog,
.filter-dialog {
  margin: 0 0 0 auto;
  width: 440px;
  height: 100dvh;
}
.quick-add-dialog h2 {
  font-size: 18px;
  margin: 15px 0 30px;
}
.navigation-dialog {
  margin: 0;
  width: 100vw;
  height: 100dvh;
}
.navigation-dialog .dialog-content {
  padding: 45px var(--right) 70px var(--left);
}
.navigation-dialog .dialog-close {
  left: 32px;
  top: 32px;
  right: auto;
  width: 76px;
  height: 60px;
}
.navigation-dialog .dialog-close svg {
  width: 64px;
  height: 64px;
}
.menu-wordmark {
  font-family: var(--serif);
  font-size: 100px;
  line-height: 1;
  letter-spacing: -0.065em;
  display: inline-block;
}
.menu-columns {
  display: grid;
  grid-template-columns: 190px minmax(380px, 1fr) 120px;
  gap: 50px;
  margin-top: 80px;
}
.departments {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.departments button {
  font-family: var(--serif);
  font-size: 30px;
  position: relative;
  padding: 0;
  line-height: 1.4;
}
.department-dot {
  position: absolute;
  left: -20px;
  font-size: 20px;
  top: 10px;
}
.menu-group {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 20px;
  margin-bottom: 42px;
  font-size: 12px;
}
.menu-group > div {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.menu-group a {
  display: block;
  padding-bottom: 15px;
  min-height: 38px;
}
.menu-preview img {
  height: 70px;
  object-fit: cover;
}
.menu-preview span {
  display: block;
  font-size: 10px;
  letter-spacing: 0.07em;
  line-height: 1.8;
  margin-top: 8px;
}
.menu-secondary {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  font-size: 11px;
  margin-top: 55px;
}
.footer {
  padding: 100px 32px 30px;
  text-align: center;
  background: white;
}
.footer-brand {
  font-family: var(--serif);
  font-size: 55px;
  letter-spacing: -0.065em;
}
.footer > p {
  font-size: 10px;
  letter-spacing: 0.13em;
  margin: 25px 0 40px;
}
.footer > div:not(.footer-bottom) {
  display: flex;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
  font-size: 10px;
  letter-spacing: 0.04em;
}
.footer-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 80px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 10px;
  letter-spacing: 0.06em;
}
/* Campaign: viewport media, one pinned wordmark, native scrolling. */
.campaign-block {
  height: 100svh;
  min-height: 600px;
  position: relative;
  overflow: hidden;
  background: #e6e2d9;
}
.campaign-images,
.campaign-block > video {
  width: 100%;
  height: 100%;
}
.campaign-images {
  display: flex;
}
.campaign-images img {
  width: 100%;
  height: 100%;
  object-position: center 40%;
}
.tone-light {
  color: white;
}
.tone-dark {
  color: var(--ink);
}
.hero .campaign-images::after,
.video::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.13), transparent 60%);
  pointer-events: none;
}
.hero .campaign-copy {
  position: absolute;
  top: 17%;
  left: 4.3%;
  width: 75%;
  pointer-events: none;
}
.campaign-copy h1,
.campaign-copy h2 {
  white-space: pre-line;
  font: 900 clamp(56px, 8.4vw, 155px)/0.94 var(--ui);
  letter-spacing: -0.065em;
  margin: 0;
}
.campaign-copy p {
  font-size: 11px;
  letter-spacing: 0.08em;
  margin: 24px 0;
}
.campaign-overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 180ms;
}
.campaign-overlay.visible {
  opacity: 1;
}
.campaign-wordmark {
  position: absolute;
  right: 1.6vw;
  bottom: 20svh;
  font: 400 clamp(80px, 10.8vw, 220px)/0.8 var(--serif);
  letter-spacing: -0.075em;
}
.campaign-arrow {
  position: absolute;
  right: var(--edge);
  bottom: 5svh;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}
.campaign-overlay:not(.visible) .campaign-arrow {
  pointer-events: none;
}
.department-switch {
  position: absolute;
  left: 4.3%;
  bottom: 5svh;
  display: flex;
  gap: 35px;
  align-items: center;
  z-index: 12;
  font-size: 11px;
  letter-spacing: 0.06em;
}
.department-switch > div {
  display: flex;
  gap: 20px;
}
.department-switch button {
  font-size: 12px;
  min-height: 44px;
  padding: 10px 0;
}
.department-switch button[aria-pressed="true"] {
  text-decoration: underline;
  text-underline-offset: 7px;
}
.department-switch > span {
  opacity: 0.85;
}
.video .campaign-copy {
  position: absolute;
  left: 4.3%;
  bottom: 20%;
  max-width: 50%;
}
.video .campaign-copy h2 {
  font-size: clamp(40px, 5vw, 90px);
}
.video-control {
  position: absolute;
  left: 4.3%;
  bottom: 5svh;
  z-index: 15;
  font-size: 11px;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.video-control span {
  font-size: 18px;
}
.treatment-split .campaign-images img {
  width: 50%;
}
.treatment-split .campaign-copy {
  position: absolute;
  top: 6%;
  left: 3%;
  max-width: 90%;
  color: #fff;
}
.treatment-inset {
  background: white;
  padding: 8vh 20vw;
}
.treatment-inset .campaign-copy {
  position: absolute;
  left: 4.3%;
  top: 20%;
  width: 50%;
}
.treatment-inset .campaign-copy h2 {
  font-size: clamp(48px, 6vw, 105px);
  line-height: 1;
}
.treatment-inset .campaign-images img {
  object-position: 50% 30%;
}
.collection-entrance {
  height: 75svh;
  min-height: 440px;
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  position: relative;
  background: white;
}
.collection-entrance h2 {
  font: 400 46px/1.1 var(--serif);
  margin-bottom: 12px;
}
.collection-entrance a {
  font-size: 11px;
  text-align: center;
  padding: 10px;
}
.vertical-line {
  display: block;
  width: 1px;
  height: 150px;
  background: linear-gradient(#d5d5d2 35%, #171715 35%);
  margin: 26px auto 0;
}
.new-collection {
  scroll-margin-top: 90px;
}
/* Catalogue modes share product cards; composition changes through layout. */
.listing {
  padding: 140px 0 80px;
  position: relative;
  min-height: 70vh;
}
.embedded-listing {
  padding-top: 60px;
}
.category-rail {
  position: fixed;
  top: 23vh;
  left: var(--edge);
  width: calc(var(--left) - 55px);
  z-index: 20;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
}
.category-rail a {
  display: block;
  min-height: 32px;
  padding: 5px 0;
}
.category-rail a.active {
  font-weight: 700;
  letter-spacing: 0.035em;
}
.filter-trigger {
  padding: 25px 0 10px;
  min-height: 44px;
  font-size: 12px;
}
.embedded-listing .category-rail,
.embedded-listing .view-control {
  position: absolute;
}
.view-control {
  position: fixed;
  left: var(--edge);
  bottom: 30px;
  z-index: 20;
  font-size: 12px;
}
.view-control > span {
  display: block;
  padding: 10px;
}
.view-control > div {
  display: flex;
  gap: 0;
}
.view-control button {
  width: 32px;
  height: 44px;
  padding: 0;
  font-size: 12px;
}
.view-control button[aria-pressed="true"] {
  font-weight: 700;
}
.catalogue-stage {
  margin: 0 var(--right) 0 var(--left);
  min-height: 60vh;
}
.listing-heading {
  display: flex;
  align-items: center;
  gap: 25px;
  padding: 0 0 35px;
}
.listing-heading h1 {
  font-size: 12px;
  letter-spacing: 0.05em;
  margin: 0;
}
.listing-heading > span {
  font-size: 10px;
  color: var(--muted);
}
.mobile-filter {
  display: none;
}
.product-grid {
  display: grid;
  align-items: start;
}
.product-card {
  position: relative;
  min-width: 0;
}
.product-image {
  position: relative;
  display: block;
  overflow: hidden;
  background: #f4f2ef;
}
.product-image img {
  height: 100%;
  width: 100%;
  aspect-ratio: 2/3;
  transition: transform 450ms var(--ease);
}
.product-image:hover img {
  transform: scale(1.015);
}
.image-caption {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #fff;
  padding: 5px 10px;
  font-size: 11px;
  opacity: 0;
}
.product-caption {
  position: relative;
  padding: 13px 30px 0 0;
  display: flex;
  flex-direction: column;
  font-size: 12px;
  line-height: 1.6;
}
.product-name {
  display: block;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.price {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.card-add {
  position: absolute;
  right: -11px;
  top: 2px;
}
.card-colours {
  display: flex;
  gap: 4px;
  padding-top: 10px;
}
.card-colours span {
  width: 9px;
  height: 9px;
  border: 1px solid #c6c5c1;
}
.view-2 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 28px;
  row-gap: 65px;
}
.view-3 {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 60px 24px;
}
.compact-card .product-image {
  background: white;
  padding: 12% 3%;
}
.compact-card .product-image img {
  aspect-ratio: 3/4;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.compact-card .product-caption {
  text-align: center;
  padding: 12px 0 35px;
  font-size: 12px;
}
.compact-card .product-name {
  position: absolute;
  bottom: 100%;
  width: 100%;
  white-space: normal;
  background: white;
  opacity: 0;
  z-index: 1;
  padding: 5px;
  pointer-events: none;
}
.compact-card:hover .product-name,
.compact-card:focus-within .product-name {
  opacity: 1;
  pointer-events: auto;
}
.compact-card .card-add {
  top: auto;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
}
.view-1 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 80px 32px;
}
.view-1 .product-card:nth-child(8n + 1) {
  grid-column: 1/3;
}

    height: 30px;
    font-size: 11px;

    display: block;

.reference-caption button {

.reference-grid li {

<script>
// MyShoppe static demo. A browser-only port of web/src (storefront and Bespoke Studio):
// same routes, markup and class names, with the development seed catalogue
// (backend/app/seed.py) in memory and the bag, favourites and orders kept in
// localStorage instead of the API. No API calls, no payments. Photos load
// from their Unsplash originals; campaign.mp4 and media/bespoke/ sit beside this file.
"use strict";
(() => {
  /* ---------- helpers (web/src/lib/api.ts, components/ui.tsx) ---------- */
  const $ = (selector, root = document) => root.querySelector(selector);
  const esc = (value) =>
    String(value ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const money = (paise) =>
    new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 2,
      minimumFractionDigits: 2,
    }).format(paise / 100);
  const titleCase = (value) =>
    value.replaceAll("-", " ").replace(/\b\w/g, (c) => c.toUpperCase());
  const uuid = () =>
    globalThis.crypto?.randomUUID?.() ||
    `${Date.now().toString(16)}-${Math.random().toString(16).slice(2)}`;
  const reducedMotion = () =>
    matchMedia("(prefers-reduced-motion: reduce)").matches;
  const categories = {
    women: ["dresses", "tops", "trousers", "skirts", "knitwear", "outerwear", "co-ords"],
    home: [
      "duvet-covers",
      "duvet-inserts",
      "bedsheets",
      "pillowcases",
      "quilts",
      "throws",
      "cushion-covers",
    ],
  };
  const ICONS = {
    plus: "M12 4v16M4 12h16",
    arrow: "M4 12h16m-7-7 7 7-7 7",
    bookmark: "M6 3h12v18l-6-4-6 4V3Z",
    close: "m5 5 14 14M19 5 5 19",
    chevron: "m6 9 6 6 6-6",
  };
  const icon = (name, size = 22) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="${ICONS[name]}"></path></svg>`;
  const errorHTML = (error) =>
    error
      ? `<p class="error" role="alert">${esc(error instanceof Error ? error.message : error)}</p>`
      : "";
  const empty = (title, inner) =>
    `<div class="empty-state"><h1>${esc(title)}</h1>${inner}</div>`;
  const fail = (message) => {
    throw new Error(message);
  };

  // On a web server (Cloudflare Pages) the app uses real paths like /women.
  // Opened straight from disk (file://) it routes with #/women instead and
  // loads its assets relative to this file.
  const HASH_ROUTING = location.protocol === "file:";
  const ROOT = HASH_ROUTING ? location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "") : "/";
  const here = () =>
    HASH_ROUTING ? new URL(location.hash.slice(1) || "/", "https://myshoppe.demo") : location;
  const setUrl = (state, path, replace = false) =>
    history[replace ? "replaceState" : "pushState"](
      state,
      "",
      HASH_ROUTING ? `${location.href.replace(/#.*$/, "")}#${path}` : path,
    );

  // Re-render a region while keeping keyboard focus and caret on the element
  // carrying the same data-f key, so typing and tabbing survive a redraw.
  function keepFocus(scope, draw) {
    const active = document.activeElement;
    const key = active && scope.contains(active) ? active.getAttribute("data-f") : null;
    let caret = null;
    try {
      if (key && typeof active.selectionStart === "number")
        caret = [active.selectionStart, active.selectionEnd];
    } catch {}
    draw();
    if (!key) return;
    const next = scope.querySelector(`[data-f="${CSS.escape(key)}"]`);
    if (!next) return;
    next.focus({ preventScroll: true });
    if (caret)
      try {
        next.setSelectionRange(...caret);
      } catch {}
  }

  // <Dialog> from components/ui.tsx: a native modal with the same markup.
  function makeDialog(title, className) {
    const el = document.createElement("dialog");
    el.className = `dialog ${className}`;
    el.setAttribute("aria-label", title);
    el.innerHTML = `<div class="dialog-content"><button class="icon-button dialog-close" aria-label="Close ${esc(title)}">${icon("close")}</button></div>`;
    const content = el.firstElementChild;
    const closeButton = content.firstElementChild;
    let overflow = "";
    const dialog = {
      el,
      onClose: () => dialog.close(),
      handle: null,
      set(html) {
        keepFocus(el, () => {
          while (closeButton.nextSibling) closeButton.nextSibling.remove();
          content.insertAdjacentHTML("beforeend", html);
        });
      },
      open() {
        if (el.open) return;
        if (!el.isConnected) document.body.append(el);
        el.showModal();
        overflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
      },
      close() {
        if (!el.open) return;
        el.close();
        document.body.style.overflow = overflow;
      },
    };
    closeButton.addEventListener("click", () => dialog.onClose());
    el.addEventListener("cancel", (e) => {
      e.preventDefault();
      dialog.onClose();
    });
    el.addEventListener("click", (e) => {
      if (e.target === el) dialog.onClose();
      else dialog.handle?.(e);
    });
    for (const type of ["change", "input", "submit"])
      el.addEventListener(type, (e) => dialog.handle?.(e));
    return dialog;
  }

  /* ---------- media: original sources of web/public/media (sources.json) ---------- */
  const PHOTOS = {
    "campaign-women": "1539109136881-3be0616acf4b",
    "campaign-home": "1631049307264-da0ec9d70304",
    "woman-1": "1539109136881-3be0616acf4b",
    "woman-2": "1483985988355-763728e1935b",
    "woman-3": "1524504388940-b1c1722653e1",
    "woman-4": "1509631179647-0177331693ae",
    "woman-5": "1550614000-4895a10e1bfd",
    "woman-6": "1490481651871-ab68de25d43d",
    "home-1": "1631049307264-da0ec9d70304",
    "home-2": "1611892440504-42a792e24d32",
    "home-3": "1616594039964-ae9021a400a0",
    "home-4": "1615874959474-d609969a20ed",
  };
  const photo = (name, width = 1200) =>
    `https://images.unsplash.com/photo-${PHOTOS[name]}?auto=format&fit=crop&w=${width}&q=80`;
  const FILM = `${ROOT}campaign.mp4`; // served next to index.html

  /* ---------- catalogue (backend/app/seed.py) ---------- */
  const WOMEN = [
    ["Fluid linen shirt", "tops", 295000],
    ["Sculpted cotton dress", "dresses", 595000],
    ["Relaxed wool blazer", "outerwear", 795000],
    ["Wide-leg tailored trousers", "trousers", 435000],
    ["Fine knit cardigan", "knitwear", 395000],
    ["Satin midi skirt", "skirts", 355000],
    ["Structured poplin shirt", "tops", 295000],
    ["Longline linen waistcoat", "co-ords", 495000],
  ];
  const HOME = [
    ["Washed linen duvet cover", "duvet-covers", 895000],
    ["Cotton percale sheet", "bedsheets", 435000],
    ["Linen pillowcase pair", "pillowcases", 295000],
    ["Textured cotton throw", "throws", 595000],
    ["Quilted cotton bedspread", "quilts", 795000],
    ["Cotton cushion cover", "cushion-covers", 195000],
    ["Lightweight duvet insert", "duvet-inserts", 695000],
    ["Striped linen duvet cover", "duvet-covers", 945000],
  ];
  const products = [];
  const productBySlug = new Map();
  const productById = new Map();
  const variantById = new Map();
  for (const [department, source, count] of [
    ["women", WOMEN, 24],
    ["home", HOME, 16],
  ]) {
    for (let i = 0; i < count; i++) {
      const [title, category, price] = source[i % source.length];
      const edition = ["", " — Natural", " — Studio"][Math.floor(i / source.length)];
      const slug =
        title.toLowerCase().replaceAll(" ", "-") + (i >= source.length ? `-${i}` : "");
      const [prefix, n] = department === "women" ? ["woman", 6] : ["home", 4];
      const media = ["lead", "continuation", "continuation", "continuation", "continuation", "cutout"].map(
        (role, j) => ({
          src: photo(`${prefix}-${((i + j) % n) + 1}`),
          alt: `Editorial reference for ${title}, view ${j + 1}`,
          role,
        }),
      );
      const product = {
        id: `${department}-${i + 1}`,
        order: products.length,
        slug,
        title: title + edition,
        department,
        category,
        description:
          "A considered everyday piece with a soft, natural texture and a quietly distinctive silhouette. Designed to be layered, lived in, and returned to season after season.",
        material: title.includes("linen") ? "100% linen" : "100% cotton",
        care: "Gentle wash at 30°C. Wash with similar colours. Line dry. Cool iron.",
        details:
          department === "women"
            ? {
                fit: "Relaxed silhouette",
                measurements:
                  "Model imagery is editorial reference. Replace with verified garment measurements.",
                origin: "Merchant confirmation required",
              }
            : {
                dimensions: "Queen 230 × 250 cm; King 260 × 280 cm",
                contents: "1 cover; insert and pillowcases sold separately",
                type: category.includes("cover") ? "Duvet cover" : title,
                origin: "Merchant confirmation required",
              },
        media,
        relations: {},
        variants: [],
      };
      [
        ["Ecru", "#d9d0bd"],
        ["Black", "#262522"],
      ].forEach(([colour, hex], j) => {
        (department === "women" ? ["XS", "S", "M", "L"] : ["Queen", "King"]).forEach((size, k) => {

          };

      });
      product.price_paise = Math.min(...product.variants.map((v) => v.price_paise));

  /* ---------- local "API" state ---------- */
  const STORE_KEY = "myshoppe-demo-v1";

  };
  try {
    Object.assign(store, JSON.parse(localStorage.getItem(STORE_KEY) || "{}"));
  } catch {}
  const persist = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch {}
  };
  const subscribers = new Set();
  const changed = () => {
    persist();
    for (const fn of [...subscribers]) fn();
  };
  const subscribe = (fn) => {
    subscribers.add(fn);
    return () => subscribers.delete(fn);
  };
  const available = (variant) => variant.stock - (store.sold[variant.id] || 0);
  const isSaved = (id) => store.saved.includes(id);

  function cart() {
    const items = store.cart.flatMap(({ variant_id, quantity }) => {
      const v = variantById.get(variant_id);
      if (!v) return [];
      const p = productById.get(v.product_id);
      return [
        {
          variant_id,
          product_id: p.id,
          title: p.title,
          slug: p.slug,
          image: p.media[0].src,
          size: v.size,
          colour: v.colour,
          quantity,
          price_paise: v.price_paise,
          available: available(v),
          status: "published",
        },
      ];
    });
    return {
      version: store.version,
      items,
      subtotal: items.reduce((sum, i) => sum + i.quantity * i.price_paise, 0),
      count: items.reduce((sum, i) => sum + i.quantity, 0),
    };
  }
  function changeQuantity(id, quantity) {
    const v = variantById.get(id);
    if (quantity) {
      if (!v) fail("This item is no longer available.");
      if (available(v) < quantity) fail("There are not enough items available.");
    }
    const line = store.cart.find((i) => i.variant_id === id);
    if (!quantity) store.cart = store.cart.filter((i) => i.variant_id !== id);
    else if (line) line.quantity = quantity;
    else store.cart.push({ variant_id: id, quantity });
    store.version++;
    changed();
  }
  function save(id) {
    store.saved = isSaved(id) ? store.saved.filter((x) => x !== id) : [...store.saved, id];
    changed();
  }
  function listProducts({
    department,
    category,
    q,
    colour,
    size,
    available: inStock,
    sale,
    sort = "new",
    page = 1,
    limit = 24,
  } = {}) {
    const query = (q || "").trim().toLowerCase();
    const terms = query.split(/\s+/).filter(Boolean).map((t) => t.replace(/(es|s)$/, ""));
    const matches = products.filter((p) => {
      if (department && p.department !== department) return false;
      if (category && p.category !== category) return false;
      if (query) {
        const doc = `${p.title} ${p.material} ${p.category}`.toLowerCase();
        if (!p.title.toLowerCase().includes(query) && !terms.every((t) => doc.includes(t)))
          return false;
      }
      return p.variants.some(
        (v) =>
          v.active &&
          (!colour || v.colour === colour) &&
          (!size || v.size === size) &&
          (!sale || (v.compare_at_paise || 0) > v.price_paise) &&
          (!inStock || available(v) > 0),
      );
    });
    const order = {
      "price-asc": (a, b) => a.price_paise - b.price_paise || a.order - b.order,
      "price-desc": (a, b) => b.price_paise - a.price_paise || a.order - b.order,
      name: (a, b) => a.title.localeCompare(b.title) || a.order - b.order,
    }[sort] || ((a, b) => a.order - b.order);
    matches.sort(order);
    return {
      items: matches.slice((page - 1) * limit, page * limit),
      total: matches.length,
      page,
      pages: Math.max(1, Math.ceil(matches.length / limit)),
    };
  }

      quick.set(`<h2>${esc(product.title)}</h2>

          <div class="swatches" aria-label="Colour">${uniqueColours(product)
            .map(
              (v) =>
                `<button class="${colour === v.colour ? "selected" : ""}" aria-label="${esc(v.colour)}" aria-pressed="${colour === v.colour}" data-colour="${esc(v.colour)}" data-f="colour-${esc(v.colour)}"><span style="background:${v.colour_hex}"></span></button>`,
            )

            ${variants

              )
              .join("")}
          </fieldset>
          ${errorHTML(error)}
          <button class="button" data-add data-f="add">ADD TO BAG</button>
          <p class="micro muted">${chosen && available(chosen) <= 2 ? "FEW ITEMS LEFT" : "Choose your size. Find your fit."}</p>
        </div>`);
    };
    quick.handle = (e) => {
      if (e.type !== "click") return;
      const swatch = e.target.closest("[data-colour]");
      const size = e.target.closest("[data-size]");
      if (swatch) {
        colour = swatch.dataset.colour;

            notify("Added to your bag");

          }
        }
      } else return;
      draw();
    };
    draw();
    quick.open();
  }

  function Listing(container, { department, category, embedded = false, search = false }) {
    const p = new URLSearchParams(here().search);
    const s = {
      view: [1, 2, 3].includes(Number(p.get("view"))) ? Number(p.get("view")) : 1,
      query: p.get("q") || "",
      sort: p.get("sort") || "new",
      colour: p.get("colour") || "",
      size: p.get("size") || "",
      available: p.get("available") === "true",
      sale: p.get("sale") === "true",
      page: Math.max(1, Number(p.get("page")) || 1),
    };
    const el = document.createElement("div");
    el.className = `listing ${embedded ? "embedded-listing" : ""}`;
    container.append(el);
    const filters = makeDialog("Filters", "filter-dialog");
    el.append(filters.el);
    let data;
    function load() {
      data = listProducts({
        department,
        category,
        q: s.query,
        colour: s.colour,
        size: s.size,
        available: s.available,
        sale: s.sale,
        sort: s.sort,
        page: s.page,
      });
      if (embedded) return;
      const params = new URLSearchParams();
      if (department) params.set("department", department);
      if (category) params.set("category", category);
      if (s.query) params.set("q", s.query);
      if (s.colour) params.set("colour", s.colour);
      if (s.size) params.set("size", s.size);
      if (s.available) params.set("available", "true");
      if (s.sale) params.set("sale", "true");
      params.set("sort", s.sort);
      params.set("page", String(s.page));
      params.set("view", String(s.view));
      setUrl(history.state, `${here().pathname}?${params}`, true);
    }
    function drawFilters() {
      const option = (value, label, current) =>
        `<option value="${esc(value)}" ${value === current ? "selected" : ""}>${esc(label)}</option>`;
      filters.set(`<h2>FILTERS &amp; SORT</h2>
        <label class="field">Sort<select data-filter="sort" data-f="sort">
          ${option("new", "New in", s.sort)}${option("price-asc", "Price, low to high", s.sort)}${option("price-desc", "Price, high to low", s.sort)}${option("name", "Name", s.sort)}
        </select></label>
        <label class="field">Colour<select data-filter="colour" data-f="colour">
          ${option("", "All colours", s.colour)}${option("Ecru", "Ecru", s.colour)}${option("Black", "Black", s.colour)}
        </select></label>
        <label class="field">Size<select data-filter="size" data-f="size">
          ${option("", "All sizes", s.size)}${(department === "home" ? ["Queen", "King"] : ["XS", "S", "M", "L"]).map((x) => option(x, x, s.size)).join("")}
        </select></label>
        <label class="check-field"><input type="checkbox" data-filter="available" data-f="available" ${s.available ? "checked" : ""}> In stock only</label>
        <label class="check-field"><input type="checkbox" data-filter="sale" data-f="sale" ${s.sale ? "checked" : ""}> Special prices</label>
        <button class="button primary" data-close-filters data-f="view-items">VIEW ${data.total} ITEMS</button>
        <button class="button borderless" data-clear-filters data-f="clear">CLEAR</button>`);
    }
    function draw() {
      const label = search
        ? "SEARCH"
        : category
          ? titleCase(category)
          : s.sale
            ? "SPECIAL PRICES"
            : "THE NEW";
      const panels =
        s.view === 1 &&
        department &&
        !category &&
        !search &&
        !s.query &&
        !s.colour &&
        !s.size &&
        !s.sale &&
        s.page === 1 &&

      keepFocus(el, () => {

                        `<a class="${category === cat ? "active" : ""}" href="/${department}/${cat}">|${String(i + 2).padStart(2, "0")}| ${titleCase(cat).toUpperCase()}</a>`,
                    )
                    .join("")
                : ""
            }
            <button class="filter-trigger" data-open-filters data-f="filter-trigger">FILTERS ${s.colour || s.size || s.available || s.sale ? "•" : ""}</button>

          <div class="view-control"><span>VIEW</span>

            ${
              search

                <label for="search">WHAT ARE YOU LOOKING FOR?</label>
                <input id="search" data-f="search" placeholder="Linen, a dress, a quieter home…" value="${esc(s.query)}">
                <div>${["linen", "dress", "duvet cover"]

        s.query = term.dataset.term;
        refresh();
      } else if (t.closest("[data-reset]")) {
        Object.assign(s, { colour: "", size: "", available: false, sale: false, query: "" });
        refresh();
      }
    });
    el.addEventListener("input", (e) => {
      if (e.target.id !== "search") return;
      s.query = e.target.value;
      s.page = 1;
      refresh();
    });
    el.addEventListener("submit", (e) => e.preventDefault());
    filters.handle = (e) => {
      const field = e.target.closest?.("[data-filter]");
      if (e.type === "change" && field) {
        const key = field.dataset.filter;
        if (field.type === "checkbox") s[key] = field.checked;
        else s[key] = field.value;
        if (key === "colour" || key === "size") s.page = 1;
        refresh();
      } else if (e.type === "click" && e.target.closest("[data-close-filters]")) filters.close();
      else if (e.type === "click" && e.target.closest("[data-clear-filters]")) {
        Object.assign(s, { colour: "", size: "", available: false, sale: false, sort: "new" });
        refresh();
      }
    };
    refresh();
    if (search) $("#search", el)?.focus();
    return () => filters.close();
  }

  // features/campaign.tsx
  function CampaignPage(root) {
    let department =
      new URLSearchParams(here().search).get("department") === "home" ? "home" : "women";
    let active = 0;
    let pinned = true;
    let entered = false;
    let suppressed = false;
    let direction = 0;
    let teardown = [];
    const target = () => `/collections/${department}-new-in`;
    const blocks = () => campaigns[department];
    function block(b, index) {
      const media =
        b.type === "video"
          ? `<video src="${b.src}" poster="${b.poster || ""}" muted loop playsinline preload="none" aria-label="MyShoppe editorial campaign film"></video>
             <button class="video-control">PLAY FILM <span>▷</span></button>`
          : `<div class="campaign-images">
              <img src="${b.src}" alt="${esc(index === 0 ? `MyShoppe ${department} October editorial` : b.subtitle || "MyShoppe editorial")}" fetchpriority="${index === 0 ? "high" : "auto"}" loading="${index === 0 ? "eager" : "lazy"}">
              ${b.layout === "split" ? `<img src="${b.mobile_src || b.src}" alt="A second perspective on the collection" loading="lazy">` : ""}
            </div>`;
      const other = department === "women" ? "Home" : "Women";
      return `<section data-campaign-block="${index}" ${b.type === "poster" ? `data-testid="campaign-poster"` : ""} class="campaign-block ${b.type} treatment-${b.layout} tone-${b.tone}">
        ${media}
        <div class="campaign-copy">${index === 0 ? `<h1>${esc(b.title)}</h1>` : `<h2>${esc(b.title)}</h2>`}<p>${esc(b.subtitle || "")}</p></div>
        ${
          index === 0
            ? `<div class="department-switch" aria-label="Choose department">
          <span>01 / 02</span>
          <div>${["women", "home"]
            .map(
              (d) =>
                `<button aria-label="${d === "women" ? "Women" : "Home"} department" aria-pressed="${department === d}" data-switch="${d}">${d.toUpperCase()}</button>`,
            )
            .join("")}</div>
          <button class="icon-button" aria-label="Switch to ${other}" data-switch="${other.toLowerCase()}">${icon("arrow")}</button>
        </div>`
            : ""
        }
      </section>`;
    }
    function overlay() {
      const el = $(".campaign-overlay", root);
      if (!el) return;
      el.className = `campaign-overlay ${pinned ? "visible" : ""} tone-${blocks()[active]?.tone || "dark"}`;
      el.setAttribute("aria-hidden", String(!pinned));
      $(".campaign-arrow", el).tabIndex = pinned ? 0 : -1;
    }
    function enter(e) {
      e.preventDefault();
      if (!entered) {
        setUrl({ campaignEntry: true }, `${target()}?entry=1`);
        entered = true;
      }
      $("#new-collection")?.scrollIntoView({ behavior: reducedMotion() ? "instant" : "smooth" });
    }
    function change(d) {
      if (d === department) return;
      direction = d === "home" ? 1 : -1;
      department = d;
      active = 0;
      entered = false;
      suppressed = false;
      setUrl({}, d === "women" ? "/" : "/?department=home", true);
      window.scrollTo({ top: 0, behavior: "instant" });
      draw();
    }
    function video(el) {
      const button = el.nextElementSibling;
      let manual = false;
      const label = () => {
        button.innerHTML = el.paused ? "PLAY FILM <span>▷</span>" : "PAUSE FILM <span>Ⅱ</span>";
      };
      el.addEventListener("play", label);
      el.addEventListener("pause", label);
      const reduced = reducedMotion() || Boolean(navigator.connection?.saveData);
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting && !manual && !reduced) el.play().catch(label);
            else el.pause();
          }
        },
        { threshold: 0.4 },
      );
      observer.observe(el);
      const visibility = () => {
        if (document.hidden) el.pause();
      };
      document.addEventListener("visibilitychange", visibility);
      button.addEventListener("click", () => {
        if (el.paused) {
          manual = false;
          el.play().catch(label);
        } else {
          manual = true;
          el.pause();
        }
      });
      return () => {
        observer.disconnect();
        document.removeEventListener("visibilitychange", visibility);
        el.pause();
      };
    }
    function draw() {
      teardown.forEach((fn) => fn());
      teardown = [];
      root.innerHTML = `<main id="main" class="campaign-page">
        <div class="campaign-track" data-testid="campaign-sequence" data-department="${department}">
          ${blocks().map(block).join("")}
        </div>
        <div class="campaign-overlay">
          <span class="campaign-wordmark" aria-hidden="true">myshoppe</span>
          <a href="${target()}" aria-label="Explore the ${department} new collection" class="campaign-arrow">${icon("arrow", 32)}</a>
        </div>
        <section class="collection-entrance">
          <h2>THE NEW</h2>
          <a href="${target()}">SCROLL DOWN<span class="vertical-line"></span></a>
        </section>
        <section id="new-collection" class="new-collection"></section>
        ${footer()}
      </main>`;
      overlay();
      for (const a of root.querySelectorAll(".campaign-arrow, .collection-entrance a"))
        a.addEventListener("click", enter);
      for (const b of root.querySelectorAll("[data-switch]"))
        b.addEventListener("click", () => change(b.dataset.switch));
      const hero = $("[data-campaign-block='0']", root);
      let start = null;
      hero.addEventListener("touchstart", (e) => {
        start = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      });
      hero.addEventListener("touchend", (e) => {
        if (!start) return;
        const dx = e.changedTouches[0].clientX - start.x;
        const dy = e.changedTouches[0].clientY - start.y;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5)
          change(department === "women" ? "home" : "women");
        start = null;
      });
      root.querySelectorAll("video").forEach((v) => teardown.push(video(v)));
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries)
            if (entry.intersectionRatio >= 0.45) {
              active = Number(entry.target.dataset.campaignBlock);
              overlay();
            }
        },
        { threshold: [0.45, 0.65] },
      );
      root.querySelectorAll("[data-campaign-block]").forEach((n) => observer.observe(n));
      teardown.push(() => observer.disconnect());
      teardown.push(Listing($("#new-collection", root), { department, embedded: true }));
      if (direction && !reducedMotion()) {
        const animation = $(".hero .campaign-images", root)?.animate(
          [
            { transform: `translateX(${direction * 100}%)`, opacity: 0.65 },
            { transform: "translateX(0)", opacity: 1 },
          ],
          { duration: 560, easing: "cubic-bezier(.22,.68,0,1)", fill: "both" },
        );
        teardown.push(() => animation?.cancel());
      }
    }
    let frame = 0;
    let previous = scrollY;
    let timer;
    const scroll = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        const box = $(".collection-entrance", root)?.getBoundingClientRect();
        if (!box) return;
        const nextPinned = box.top > innerHeight * 0.45;
        if (nextPinned !== pinned) {
          pinned = nextPinned;
          overlay();
        }
        if (box.top > innerHeight && suppressed) suppressed = false;
        if (
          scrollY > previous &&
          box.top < innerHeight * 0.5 &&
          box.bottom > innerHeight * 0.4 &&
          !entered &&
          !suppressed &&
          !timer
        ) {
          timer = setTimeout(() => {
            setUrl({ campaignEntry: true }, `${target()}?entry=1`);
            entered = true;
            timer = undefined;
          }, 200);
        }
        if (box.top >= innerHeight * 0.5 && timer) {
          clearTimeout(timer);
          timer = undefined;
        }
        previous = scrollY;
      });
    };
    const back = () => {
      entered = here().pathname.startsWith("/collections/");
      suppressed = true;
    };
    draw();
    addEventListener("scroll", scroll, { passive: true });
    addEventListener("popstate", back);
    scroll();
    return () => {
      teardown.forEach((fn) => fn());
      removeEventListener("scroll", scroll);
      removeEventListener("popstate", back);
      cancelAnimationFrame(frame);
      clearTimeout(timer);
    };
  }

  // Private uploads (/api/bespoke/{id}/assets): kept in this browser's IndexedDB.
  async function toWebp(file) {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) fail("The image could not be read.");
    let bitmap;
    try {
      bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch {
      fail("The image could not be read.");
    }
    if (bitmap.width * bitmap.height > 25_000_000) fail("Use a JPG, PNG or WebP under 25 megapixels.");
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/webp", 0.85));
    return blob || fail("The image could not be read.");
  }
  const assets = (() => {
    const urls = new Map();
    const owners = new Map();
    let opening;
    const open = () =>
      (opening ||= new Promise((resolve) => {
        try {
          const req = indexedDB.open("myshoppe-demo", 1);
          req.onupgradeneeded = () => req.result.createObjectStore("assets", { keyPath: "id" });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch {
          resolve(null);
        }
      }));
    const request = async (mode, fn) => {
      const db = await open();
      if (!db) return undefined;
      return new Promise((resolve) => {
        const tx = db.transaction("assets", mode);
        const req = fn(tx.objectStore("assets"));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = tx.onabort = () => resolve(undefined);
      });
    };
    const remember = (id, design, blob) => {
      owners.set(id, design);
      if (!urls.has(id)) urls.set(id, URL.createObjectURL(blob));
    };
    return {
      async load() {
        for (const a of (await request("readonly", (s) => s.getAll())) || [])
          remember(a.id, a.design_id, a.blob);
      },
      url: (id) => urls.get(id) || "",
      async add(designId, file) {
        if (!file.size || file.size > 5_000_000) fail("Use a file under 5 MB.");
        const kind = (file.type || "").split(";")[0];
        let blob = file;
        if (kind.startsWith("image/")) blob = await toWebp(file);
        else if (!["audio/webm", "audio/ogg", "audio/mp4"].includes(kind))

        if ([...owners.values()].filter((x) => x === designId).length >= 30)
          fail("This design has reached its upload limit (30 files).");
        const id = uuid();
        remember(id, designId, blob);
        await request("readwrite", (s) => s.put({ id, design_id: designId, blob }));
        return id;
      },
    };

  // studio.tsx + board.tsx
  function BespokePage(root) {
    let d = freshDesign();
    let brief = null;
    let step = 0;
    let filter = "All";
    let query = "";
    let saved = [];
    let pending = false;
    let error = null;
    let notice = "";
    let recovery = null;
    let initialized = false;
    let agreed = false;
    let locked = false;
    let pinTarget = null;
    let part = "Neckline";
    let note = "";
    let recording = false;
    let seconds = 0;
    let uploading = false;
    let recorder = null;
    let stream = null;
    let tick = null;
    let alive = true;
    let fitOpen = false;
    let historyOpen = false;
    const mediaBusy = () => recording || uploading;
    const dirty = () => !sameData(d, brief?.design || freshDesign());

    root.innerHTML = `<main id="main" class="bespoke-studio"></main>`;
    const main = $("main", root);
    const zoomDialog = makeDialog("Fabric and lace close-up", "texture-dialog");
    const libraryDialog = makeDialog("Your saved designs", "");
    const reloadDialog = makeDialog("Reload saved brief", "");
    const recoveryDialog = makeDialog("Recover unsaved changes", "");
    const refDialog = makeDialog("Studio reference library", "reference-library-dialog");
    const pinDialog = makeDialog("Add a design detail", "");
    const dialogs = [zoomDialog, libraryDialog, reloadDialog, recoveryDialog, refDialog, pinDialog];
    for (const x of dialogs) main.append(x.el);

    function syncRecovery() {
      if (!initialized) return;
      try {
        const key = `bespoke-recovery:${brief?.id || "new"}`;
        if (dirty())
          sessionStorage.setItem(
            key,
            JSON.stringify({ design: d, baseVersion: brief?.version || 0, id: brief?.id || null }),
          );
        else if (!recovery) sessionStorage.removeItem(key);
      } catch {
        notice = "Tab recovery is unavailable. Save your draft to keep these changes.";
      }
    }
    function change(next) {
      d = next;
      notice = "";
      agreed = false;
    }
    const field = (key, value) => change({ ...d, [key]: value });
    function goStep(n) {
      if (mediaBusy()) error = Error("Finish recording or uploading before changing steps.");
      else if (n > 0 && !d.fabric) error = Error("Choose a fabric to start your design.");
      else if (n > 1 && !d.lace_choice) error = Error("Choose a lace, select without lace, or ask for help.");
      else {
        step = n;
        error = null;
        window.scrollTo({ top: 0, behavior: "instant" });
        draw();
        requestAnimationFrame(() => $(".studio-intro h1", main)?.focus());
        return;
      }
      draw();
    }
    function ensureBrief() {
      if (brief) return brief;
      brief = bespokeApi.create();
      setUrl(null, `/bespoke?design=${brief.id}`, true);
      try {
        sessionStorage.removeItem("bespoke-recovery:new");
      } catch {}
      return brief;
    }
    function downloadDraft() {
      const blob = new Blob(
        [JSON.stringify({ briefId: brief?.id, baseVersion: brief?.version, design: d }, null, 2)],
        { type: "application/json" },
      );
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "MyShoppe-design-backup.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function reloadSaved() {
      if (!brief) return;
      brief = bespokeApi.get(brief.id);
      d = clone(brief.design);
      agreed = false;
      reloadDialog.close();
      notice = "Latest brief loaded.";
    }
    function save() {
      const b = ensureBrief();
      brief = bespokeApi.save(b.id, b.version, d);
      return brief;
    }
    async function run(fn) {
      if (locked) return;
      locked = true;
      pending = true;
      error = null;
      draw();
      try {
        await fn();
      } catch (e) {
        error = e;
        requestAnimationFrame(() => $(".studio-feedback", main)?.scrollIntoView({ block: "center" }));
      } finally {
        locked = false;
        pending = false;
        if (alive) draw();
      }
    }
    const act = (action) =>
      run(async () => {
        const b = save();
        brief = bespokeApi.action(b.id, b.version, action);
        notice =
          action === "submit"
            ? "Your design is with the boutique. Return here for the review."
            : "Your agreement is recorded. The boutique can now release the brief to masterji.";
      });
    async function upload(file) {
      if (file.size > 5_000_000) fail("Use a file under 5 MB.");
      return assets.add(ensureBrief().id, file);
    }
    async function addPhotos(files) {
      if (!files.length) return;
      uploading = true;
      draw();
      try {
        for (const f of files) {
          if (d.references.length >= 6)
            fail("You can keep up to six references. Remove one before adding another.");
          const id = await upload(f);
          change({ ...d, references: [...d.references, { asset_id: id, name: f.name.slice(0, 120), pins: [] }] });
        }
      } catch (e) {
        error = e;
      } finally {
        uploading = false;
        if (alive) draw();
      }
    }
    const recordLabel = () =>
      recording
        ? `STOP · ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`
        : "RECORD A VOICE NOTE";
    async function record() {
      if (recording) {
        recorder?.stop();
        return;
      }
      uploading = true;
      draw();
      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder)
          fail("Voice recording is unavailable here. Add your idea in writing instead.");
        const audio = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!alive) {
          audio.getTracks().forEach((t) => t.stop());
          return;
        }
        stream = audio;
        const type = ["audio/webm", "audio/mp4", "audio/ogg"].find((t) => MediaRecorder.isTypeSupported(t));
        const rec = new MediaRecorder(audio, type ? { mimeType: type } : undefined);
        recorder = rec;
        const chunks = [];
        rec.ondataavailable = (e) => {
          if (e.data.size) chunks.push(e.data);
        };
        rec.onstop = async () => {
          audio.getTracks().forEach((t) => t.stop());
          clearInterval(tick);
          if (!alive) return;
          recording = false;
          uploading = true;
          draw();
          try {
            const id = await upload(new File(chunks, "voice-note", { type: rec.mimeType }));
            if (alive) change({ ...d, voice_id: id });
          } catch (e) {
            error = e;
          } finally {
            if (alive) {
              uploading = false;
              draw();
            }
          }
        };
        rec.start();
        seconds = 0;
        recording = true;
        uploading = false;
        draw();
        tick = setInterval(() => {
          seconds++;
          const button = $("[data-record]", main);
          if (button) button.textContent = recordLabel();
          if (seconds >= 120 && rec.state === "recording") rec.stop();
        }, 1000);
      } catch (e) {
        stream?.getTracks().forEach((t) => t.stop());
        uploading = false;
        error = e;
        draw();
      }
    }

        .filter(([key]) => !String(d[key] || "").trim())
        .map(([, label]) => label);
    const sent = () => !!brief && !dirty() && brief.status !== "draft";
    const progress = () =>
      [d.fabric, d.lace_choice, !requiredMissing().length, sent()].filter(Boolean).length / 4;
    const listNames = (names) =>
      names.length < 2 ? names.join("") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`;
    const showHint = () => step === 0 && !d.fabric && !hintDismissed;
    function journeyPrompt() {
      if (sent()) return statusLabel[brief.status];
      if (!d.fabric) return "Choose a fabric to begin.";
      if (!d.lace_choice) return "Now choose a lace, or keep it without.";
      const missing = requiredMissing();
      if (!missing.length) return step === 3 ? "Ready to send to the boutique." : "Ready to review your brief.";
      return step < 2 ? "Next, shape your design." : `Add your ${listNames(missing)}.`;
    }
    const journeyKey = () =>
      [showHint(), journeyPrompt(), progress(), d.fabric, d.laces.join(), d.lace_choice, step, pending, mediaBusy()].join("|");
    function barHTML() {
      const fabric = material(d.fabric);
      const chosen = d.laces.map(material).filter(Boolean);
      const busy = pending || mediaBusy();
      const hint = showHint();
      const enter = hintShown && !hint; // fade the summary in as the hint gives way
      hintShown = hint;
      barKey = journeyKey();
      const title = fabric
        ? [fabric.name, ...chosen.map((m) => m.name)].join(" + ") +
          (d.lace_choice === "none" ? " · Without lace" : d.lace_choice === "help" ? " · Lace with the boutique" : "")
        : "Every story starts with a fabric.";
      const more = (shown, cls) =>
        chosen.length > shown ? `<span class="journey-more ${cls}">+${chosen.length - shown}</span>` : "";
      const summary = hint
        ? `<p class="journey-hint">Scroll to choose your fabric <i aria-hidden="true">↓</i></p>`
        : `${
            fabric
              ? `<div class="journey-swatches"><img src="${asset(fabric.id, 360)}" alt="" width="48" height="48">${chosen
                  .slice(0, 3)
                  .map((m) => `<img class="journey-lace" src="${asset(m.id, 360)}" alt="" width="36" height="36">`)
                  .join("")}${more(3, "on-desktop")}${more(2, "on-mobile")}</div>`
              : ""
          }<div class="journey-text"><b>${esc(title)}</b><span>${esc(journeyPrompt())}</span></div>`;
      return `<div class="studio-bottom-bar">
          <div class="journey-summary ${enter ? "journey-enter" : ""}">${summary}</div>
          <div>
            ${step > 0 ? `<button class="text-button" data-back data-f="back" ${disabled(busy)}>← Back</button>` : ""}
            ${
              step < 3
                ? `<button class="button primary" data-next data-f="next" ${disabled(busy)}>${["CHOOSE YOUR LACE", "CREATE YOUR DESIGN", "REVIEW YOUR BRIEF"][step]} →</button>`
                : ""
            }
            ${step === 3 ? `<button class="button" data-edit-design data-f="edit-design" ${disabled(busy)}>EDIT DESIGN</button>` : ""}
          </div>
          <i class="journey-progress" aria-hidden="true"><i style="transform: scaleX(${progressShown})"></i></i>
        </div>`;
    }
    function animateProgress() {
      const fill = $(".journey-progress > i", main);
      const value = progress();
      if (!fill || value === progressShown) return;
      fill.getBoundingClientRect(); // commit the starting width so the change animates
      fill.style.transform = `scaleX(${value})`;
      progressShown = value;
    }
    function drawBar() {
      const bar = $(".studio-bottom-bar", main);
      if (!bar || journeyKey() === barKey) return;
      keepFocus(main, () => {
        bar.outerHTML = barHTML();
      });
      animateProgress();
    }
    const onScroll = () => {
      if (hintDismissed || !showHint()) return;
      const library = $(".studio-edit-area .studio-section-heading", main);
      if (library && library.getBoundingClientRect().top < innerHeight * 0.75) {
        hintDismissed = true;
        drawBar();
      }
    };

    // Demo: the stitching brief prints on one A4 page. html.brief-print switches on
    // the compact print layout; measured at print width, the brief is scaled to fit
    // 277 mm of page height, but never below 70% (beyond that it may run to page 2).
    const MM = 96 / 25.4;
    function fitBriefForPrint() {
      const root = document.documentElement;
      root.style.setProperty("--brief-scale", "1");
      root.classList.add("brief-print");
      const sheet = $(".master-brief", main);
      if (!sheet) return;
      const height = sheet.getBoundingClientRect().height;
      const scale = Math.max(0.7, Math.min(1, (277 * MM - 6) / height));
      root.style.setProperty("--brief-scale", scale.toFixed(3));
    }
    function endPrint() {
      document.documentElement.classList.remove("brief-print");
      document.documentElement.style.removeProperty("--brief-scale");
    }

    function draw() {
      if (!alive) return;
      syncRecovery();
      const selected = material(d.fabric);
      const busy = pending || mediaBusy();
      const html = `<div class="studio-topline">
          <a href="/">MYSHOPPE / THE BESPOKE STUDIO</a>
          <div>
            <button data-my-designs data-f="my-designs" ${disabled(busy)}>MY DESIGNS ↗</button>
            <button data-save-draft data-f="save-draft" ${disabled(busy || !initialized)}>${pending ? "SAVING…" : "SAVE DRAFT"}</button>
          </div>
        </div>
        <nav class="studio-steps" aria-label="Design steps">${["Fabric", "Lace", "Your design", "The brief"]
          .map(
            (s, i) =>
              `<button data-step="${i}" data-f="step-${i}" ${disabled(busy)} ${step === i ? `aria-current="step"` : ""}><span>0${i + 1}</span>${s}<small>${i < step ? "✓" : ""}</small></button>`,
          )
          .join("")}</nav>
        <div class="studio-intro ${step === 0 ? "studio-hero" : ""}">
          <div>
            <p class="studio-kicker">${
              [
                "A FABRIC. A FEELING. A CONVERSATION.",
                "SMALL DETAILS, PERSONAL CHOICES",
                "NO DESIGN VOCABULARY NEEDED",
                "FROM AN IDEA TO A SHARED UNDERSTANDING",
              ][step]
            }</p>
            <h1 tabindex="-1">${esc(["YOUR IDEAS.\nOUR HANDS.", "THE FINISHING\nTOUCH.", "YOUR KIND\nOF YOU.", "EVERY DETAIL.\nONE BRIEF."][step])}</h1>
            <p class="studio-lead">${
              [
                "Start with a fabric you love. Add the little details. Together, we’ll make something that feels like you.",
                "Choose a border, mix a few, or let the fabric speak for itself. Every little detail has its place.",
                "The neckline from one photo. The sleeves from another. Bring them together, in your own words.",
                "Review the materials, fit and finishing touches. One shared template, from your first idea to masterji’s worktable.",
              ][step]
            }</p>
            ${step === 0 ? `<span class="studio-signature">Made with you.</span>` : ""}
          </div>
          ${
            step === 0
              ? `<figure class="atelier-photo"><img src="${asset("atelier-hero", 1280)}" srcset="${asset("atelier-hero")} 640w, ${asset("atelier-hero", 1280)} 1280w" sizes="(max-width:767px) 100vw, 50vw" width="1280" height="850" alt="Embroidered fabric, lace and dressmaking tools on an atelier table" fetchpriority="high"><figcaption>THE STUDIO / FROM THE FIRST THREAD</figcaption></figure>`
              : ""
          }
        </div>
        ${feedbackHTML()}
        <fieldset class="studio-edit-area" ${disabled(pending || !initialized)}>${
          step === 0 ? fabricStep() : step === 1 ? laceStep() : step === 2 ? designStep() : ""
        }</fieldset>
        ${step === 3 ? reviewStep() : ""}
        ${barHTML()}`;
      keepFocus(main, () => {
        const keep = new Set(dialogs.map((x) => x.el));
        for (const node of [...main.childNodes]) if (!keep.has(node)) node.remove();
        main.insertAdjacentHTML("afterbegin", html);
      });
      animateProgress();
    }

    function openZoom(m) {
      zoomDialog.set(`<img src="${asset(m.id, 1280)}" alt="${esc(`${m.name}: ${m.description}`)}" width="1280" height="1280">
        <h2>${esc(m.name)}</h2>
        <p>${esc(m.description)} · Illustrative texture reference</p>
        <button class="button primary" data-select-zoom>SELECT ${m.id.startsWith("fabric") ? "FABRIC" : "LACE"}</button>`);
      zoomDialog.handle = (e) => {
        if (e.type !== "click" || !e.target.closest("[data-select-zoom]")) return;
        if (m.id.startsWith("fabric")) field("fabric", m.id);
        else change({ ...d, laces: [...new Set([...d.laces, m.id])], lace_choice: "selected" });
        zoomDialog.close();
        draw();
      };
      zoomDialog.open();
    }
    function openLibrary() {
      libraryDialog.set(`<h2>Your design stories.</h2>
        <a class="button" href="/bespoke">START A NEW DESIGN +</a>
        ${!saved.length ? "<p>No saved designs yet.</p>" : ""}
        <div class="saved-designs">${saved
          .map(
            (b) => `<a href="/bespoke?design=${b.id}">
              ${b.design.fabric ? `<img src="${asset(b.design.fabric, 360)}" alt="" width="80" height="80">` : ""}
              <div><b>${esc(b.design.name || "Untitled design")} ${b.design.occasion ? esc(`/ ${b.design.occasion}`) : ""}</b><p>${statusLabel[b.status]} · Revision ${b.version}</p></div>
              <span>↗</span>
            </a>`,
          )
          .join("")}</div>`);
      libraryDialog.open();
    }
    function openReload() {
      reloadDialog.set(`<h2>Keep a copy before reloading.</h2>
        <p>Your unsaved changes differ from the saved brief. Download a backup if you want to keep your notes.</p>
        <div class="studio-actions">
          <button class="button" data-download>DOWNLOAD MY CHANGES</button>
          <button class="button primary" data-discard>DISCARD CHANGES &amp; RELOAD</button>
        </div>`);
      reloadDialog.open();
    }
    reloadDialog.handle = (e) => {
      if (e.type !== "click") return;
      if (e.target.closest("[data-download]")) downloadDraft();
      else if (e.target.closest("[data-discard]")) run(async () => reloadSaved());
    };
    const dismissRecovery = () => {
      recovery = null;
      recoveryDialog.close();
      draw();
    };
    recoveryDialog.onClose = dismissRecovery;
    recoveryDialog.handle = (e) => {
      if (e.type !== "click") return;
      if (e.target.closest("[data-restore]")) {
        if (recovery) d = recovery.design;
        dismissRecovery();
      } else if (e.target.closest("[data-dismiss]")) dismissRecovery();
    };
    function openReferenceLibrary() {
      refDialog.set(`<p class="studio-kicker">A STARTING POINT FOR YOUR IDEAS</p>
        <h2>The detail library.</h2>
        <p>Illustrative references. Add a photo and pin what you would like to keep or change.</p>
        <div class="studio-reference-library">${studioReferences
          .map((r) => {
            const added = d.references.some((v) => v.asset_id === r.id);
            return `<button data-add-reference="${r.id}" ${disabled(added || d.references.length >= 6)}><img src="${asset(r.asset)}" alt="${esc(r.name)}" width="640" height="640"><span>${esc(r.name)}</span><small>${added ? "ADDED" : "ADD TO BOARD +"}</small></button>`;
          })
          .join("")}</div>`);
      refDialog.open();
    }
    refDialog.handle = (e) => {
      const button = e.type === "click" && e.target.closest("[data-add-reference]");
      if (!button) return;
      const r = studioReferences.find((x) => x.id === button.dataset.addReference);
      change({ ...d, references: [...d.references, { asset_id: r.id, name: r.name, pins: [] }] });
      refDialog.close();
      draw();
    };
    const PARTS = ["Neckline", "Sleeves", "Silhouette", "Hem and length", "Bottom", "Dupatta", "Lace placement", "Other"];
    function openPin(target) {
      pinTarget = target;
      note = "";
      pinDialog.set(`<h2>This bit, like this.</h2>
        <form>
          <label class="field">Garment detail<select aria-label="Garment detail" data-part>${PARTS.map(
            (p) => `<option ${p === part ? "selected" : ""}>${p}</option>`,
          ).join("")}</select></label>
          <label class="field">What should masterji know?<textarea autofocus required maxlength="1000" data-note placeholder="Use this sleeve shape, but make it full length."></textarea></label>
          <button class="button primary">ADD DETAIL</button>
        </form>`);
      pinDialog.open();
      $("[data-note]", pinDialog.el)?.focus();
    }
    pinDialog.onClose = () => {
      pinTarget = null;
      pinDialog.close();
    };
    pinDialog.handle = (e) => {
      if (e.type === "input" && e.target.matches("[data-part]")) part = e.target.value;
      else if (e.type === "input" && e.target.matches("[data-note]")) note = e.target.value;
      else if (e.type === "submit") {
        e.preventDefault();
        if (!pinTarget || !note.trim()) return;
        const p = { part, note: note.trim(), x: pinTarget.x, y: pinTarget.y };
        const index = pinTarget.index;
        change({ ...d, references: d.references.map((r, i) => (i === index ? { ...r, pins: [...r.pins, p] } : r)) });
        pinDialog.onClose();
        draw();
      }
    };

    main.addEventListener("click", (e) => {
      if (dialogs.some((x) => x.el.contains(e.target))) return;
      const t = e.target;
      const hit = (selector) => t.closest(selector);
      let el;
      if (hit("[data-my-designs]"))
        run(async () => {
          if (dirty()) {
            save();
            notice = "Draft saved before opening your designs.";
          }
          saved = bespokeApi.list();
          openLibrary();
        });
      else if (hit("[data-save-draft]"))
        run(async () => {
          save();
          notice = "Draft saved to your MyShoppe session.";
        });
      else if ((el = hit("[data-step]"))) goStep(Number(el.dataset.step));
      else if (hit("[data-refresh]"))
        run(async () => {
          if (dirty()) return openReload();
          reloadSaved();
        });
      else if ((el = hit("[data-fabric-filter]"))) {
        filter = el.dataset.fabricFilter;
        draw();
      } else if (hit("[data-clear-fabrics]")) {
        filter = "All";
        query = "";
        draw();
      } else if ((el = hit("[data-material]"))) {
        const id = el.dataset.material;
        if (id.startsWith("lace")) {
          const active = d.laces.includes(id);
          change({
            ...d,
            laces: active ? d.laces.filter((x) => x !== id) : [...d.laces, id],
            lace_choice: active && d.laces.length === 1 ? "" : "selected",
          });
        } else field("fabric", id);
        draw();
      } else if ((el = hit("[data-zoom-material]"))) openZoom(material(el.dataset.zoomMaterial));
      else if (hit("[data-change-fabric]")) goStep(0);
      else if ((el = hit("[data-lace-choice]"))) {
        change({ ...d, laces: [], lace_choice: el.dataset.laceChoice });
        draw();
      } else if (hit("[data-ref-library]")) openReferenceLibrary();
      else if ((el = hit("[data-pin-ref]"))) {
        const index = Number(el.dataset.pinRef);
        if (d.references[index].pins.length >= 20) return;
        const rect = el.getBoundingClientRect();
        openPin({
          index,
          x: e.detail ? ((e.clientX - rect.left) / rect.width) * 100 : 50,
          y: e.detail ? ((e.clientY - rect.top) / rect.height) * 100 : 50,
        });
      } else if ((el = hit("[data-add-detail]"))) openPin({ index: Number(el.dataset.addDetail), x: 50, y: 50 });
      else if ((el = hit("[data-remove-ref]"))) {
        const index = Number(el.dataset.removeRef);
        change({ ...d, references: d.references.filter((_, n) => n !== index) });
        draw();
      } else if ((el = hit("[data-remove-pin]"))) {
        const [i, n] = el.dataset.removePin.split(":").map(Number);
        change({
          ...d,
          references: d.references.map((v, j) => (j === i ? { ...v, pins: v.pins.filter((_, k) => k !== n) } : v)),
        });
        draw();
      } else if (hit("[data-record]")) record();
      else if (hit("[data-remove-voice]")) {
        change({ ...d, voice_id: "" });
        draw();
      } else if (hit("[data-submit]")) act("submit");
      else if (hit("[data-agree]")) act("agree");
      else if (hit("[data-print]")) window.print();
      else if (hit("[data-back]")) goStep(step - 1);
      else if (hit("[data-next]")) goStep(step + 1);
      else if (hit("[data-edit-design]")) goStep(2);
    });
    main.addEventListener("input", (e) => {
      const t = e.target;
      if (dialogs.some((x) => x.el.contains(t))) return;
      if (t.matches("[data-query]")) {
        query = t.value;
        draw();
      } else if (t.matches("[data-field]")) {
        const key = t.dataset.field;
        field(key, key === "requested_date" ? t.value || null : t.value);
        drawFeedback();
        drawBar();
      }
    });
    main.addEventListener("change", (e) => {
      const t = e.target;
      if (t.matches("[data-photos]")) {
        const files = [...t.files];
        t.value = "";
        addPhotos(files);
      } else if (t.matches("[data-agreed]")) {
        agreed = t.checked;
        draw();
      }
    });
    main.addEventListener(
      "toggle",
      (e) => {
        if (e.target.matches?.(".fit-details")) fitOpen = e.target.open;
        if (e.target.matches?.("[data-history]")) historyOpen = e.target.open;
      },
      true,
    );
    const warn = (e) => {
      if (dirty() || mediaBusy()) e.preventDefault();
    };
    addEventListener("beforeunload", warn);
    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("beforeprint", fitBriefForPrint);
    addEventListener("afterprint", endPrint);

    draw();
    (async () => {
      const id = new URLSearchParams(here().search).get("design");
      try {
        await assets.load();
        let server = null;
        if (id) {
          server = bespokeApi.get(id);
          brief = server;
          d = clone(server.design);
          step = 3;
        }
        const raw = sessionStorage.getItem(`bespoke-recovery:${id || "new"}`);
        if (raw) {
          const value = JSON.parse(raw);
          if (
            value.design &&
            value.baseVersion === (server?.version || 0) &&
            !sameData(value.design, server?.design || freshDesign())
          )
            recovery = value;
        }
      } catch (e) {
        error = e;
      }
      if (!alive) return;
      initialized = true;
      draw();
      onScroll();
      if (recovery) {
        recoveryDialog.set(`<h2>Pick up where you left off.</h2>
          <p>This tab has unsaved changes from this revision.</p>
          <button class="button primary" data-restore>RESTORE CHANGES</button>
          <button class="button" data-dismiss>USE SAVED VERSION</button>`);
        recoveryDialog.open();
      }
    })();
    return () => {
      alive = false;
      for (const x of dialogs) x.close();
      clearInterval(tick);
      if (recorder?.state === "recording") recorder.stop();
      stream?.getTracks().forEach((t) => t.stop());
      removeEventListener("beforeunload", warn);
      removeEventListener("scroll", onScroll);
      removeEventListener("beforeprint", fitBriefForPrint);
      removeEventListener("afterprint", endPrint);
      endPrint();
    };
  }


  /* ---------- router ---------- */
  let appRoot = $("#app");
  const DEFAULT_TITLE = "MyShoppe — Considered clothing. Thoughtful living.";
  let cleanup = null;
  let current = "";
  function route() {
    const path = decodeURIComponent(here().pathname.replace(/\/+$/, "")) || "/";
    const parts = path.split("/").filter(Boolean);
    const titled = (title, page, ...args) => [title ? `${title} | MyShoppe` : DEFAULT_TITLE, page, args];
    if (path === "/") return ["campaign", ...titled("", CampaignPage)];
    if (parts[0] === "products" && parts.length === 2) return ["product", ...titled("", ProductPage, parts[1])];
    if (parts[0] === "collections" && parts.length === 2)
      return ["collection", ...titled("", CollectionPage, parts[1])];
    if (path === "/bespoke") return ["bespoke", ...titled("The Bespoke Studio", BespokePage)];
    if (path === "/search") return ["search", ...titled("Search", SearchPage)];
    if (path === "/cart") return ["cart", ...titled("Your bag", BagPage)];
    if (path === "/favourites") return ["favourites", ...titled("Favourites", FavouritesPage)];
    if (path === "/checkout") return ["checkout", ...titled("Checkout", CheckoutPage)];
    if (path === "/account") return ["account", ...titled("Your account", AccountPage)];
    if (parts[0] === "account" && parts[1] === "orders" && parts.length === 3)
      return ["order", ...titled("Your order", OrderPage, parts[2])];
    if (parts[0] === "help" && parts.length <= 2) return ["help", ...titled("", HelpPage, parts[1])];
    if (parts.length <= 2 && (parts[0] === "women" || parts[0] === "home"))
      return ["department", ...titled("", DepartmentPage, parts[0], parts[1])];
    return ["notfound", ...titled("", NotFound)];
  }
  function render() {
    if (typeof cleanup === "function") cleanup();
    if (navOpen) setNav(false);
    quick.close();
    const [name, title, page, args] = route();
    current = name;
    document.title = title;
    const fresh = appRoot.cloneNode(false); // drop listeners from the previous page
    appRoot.replaceWith(fresh);
    appRoot = fresh;
    cleanup = page(fresh, ...args);
    renderShell();
  }
  function navigate(path, replace = false) {
    setUrl({}, path, replace);
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (
      !a ||
      e.defaultPrevented ||
      e.button !== 0 ||
      e.metaKey ||
      e.ctrlKey ||
      e.shiftKey ||
      e.altKey ||
      a.target ||
      a.hasAttribute("download")
    )
      return;
    const href = a.getAttribute("href");
    if (href.startsWith("#")) {
      // In-page anchors (skip link, "SCROLL DOWN"): scroll without touching the route.
      e.preventDefault();
      document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();
      return;
    }
    if (!href.startsWith("/")) return; // external link
    e.preventDefault();
    navigate(href);
  });
  addEventListener("popstate", (e) => {
    // The campaign moves between "/" and its collection URL without leaving the
    // page (history.pushState in features/campaign.tsx); keep it mounted.
    if (current === "campaign" && (here().pathname === "/" || e.state?.campaignEntry)) return;
    render();
  });
  render();
})();

</script>
